name: Twice-Daily Publication Watchdog

on:
  schedule:
    # GitHub cron is UTC. SGT is UTC+8 year-round.
    # ChatGPT-native tasks may start late under platform queueing, so verify after a realistic grace window.
    - cron: "15 2 * * *"   # 10:15 SGT — morning publication grace window
    - cron: "30 11 * * *"  # 19:30 SGT — close publication grace window
  workflow_dispatch:
    inputs:
      cycle:
        description: Publication cycle to verify
        required: true
        type: choice
        options:
          - morning
          - close
      date:
        description: Optional expected SGT date (YYYY-MM-DD)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: publication-watchdog-${{ github.event.schedule || inputs.cycle || 'manual' }}
  cancel-in-progress: false

jobs:
  verify-morning:
    name: Verify 09:00 SGT morning publication
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '15 2 * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.cycle == 'morning')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate automation definitions
        run: python scripts/validate_automation_contract.py .
      - name: Verify morning publication state
        env:
          EXPECTED_DATE: ${{ inputs.date }}
        run: |
          args=(--root . --cycle morning)
          if [ -n "${EXPECTED_DATE:-}" ]; then args+=(--date "$EXPECTED_DATE"); fi
          python scripts/verify_scheduled_publication.py "${args[@]}"

  verify-close:
    name: Verify 18:00 SGT close publication
    if: >-
      (github.event_name == 'schedule' && github.event.schedule == '30 11 * * *') ||
      (github.event_name == 'workflow_dispatch' && inputs.cycle == 'close')
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate automation definitions
        run: python scripts/validate_automation_contract.py .
      - name: Verify close publication state
        env:
          EXPECTED_DATE: ${{ inputs.date }}
        run: |
          args=(--root . --cycle close)
          if [ -n "${EXPECTED_DATE:-}" ]; then args+=(--date "$EXPECTED_DATE"); fi
          python scripts/verify_scheduled_publication.py "${args[@]}"
