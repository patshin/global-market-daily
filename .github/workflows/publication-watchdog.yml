name: Twice-Daily Publication Watchdog

on:
  schedule:
    # GitHub cron is UTC. SGT is UTC+8 year-round.
    # Two passes make recovery resilient to ChatGPT/GitHub queueing jitter.
    - cron: "45 1 * * *"   # 09:45 SGT — first morning recovery pass
    - cron: "10 2 * * *"   # 10:10 SGT — second morning recovery pass
    - cron: "45 10 * * *"  # 18:45 SGT — first close recovery pass
    - cron: "10 11 * * *"  # 19:10 SGT — second close recovery pass
  workflow_dispatch:
    inputs:
      cycle:
        description: Publication cycle to verify
        required: true
        type: choice
        options:
          - morning
          - close
      date:
        description: Optional expected SGT date (YYYY-MM-DD)
        required: false
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: publication-watchdog-${{ github.event.schedule || inputs.cycle || 'manual' }}
  cancel-in-progress: false

jobs:
  verify-morning:
    name: Verify 09:00 SGT morning publication
    if: >-
      (github.event_name == 'schedule' && (github.event.schedule == '45 1 * * *' || github.event.schedule == '10 2 * * *')) ||
      (github.event_name == 'workflow_dispatch' && inputs.cycle == 'morning')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate automation definitions
        run: python scripts/validate_automation_contract.py .

      - name: Verify morning publication state in main
        id: main_state
        continue-on-error: true
        env:
          EXPECTED_DATE: ${{ inputs.date }}
        run: |
          args=(--root . --cycle morning)
          if [ -n "${EXPECTED_DATE:-}" ]; then args+=(--date "$EXPECTED_DATE"); fi
          python scripts/verify_scheduled_publication.py "${args[@]}"

      - name: Verify morning is live on public Pages
        id: public_state
        if: steps.main_state.outcome == 'success'
        continue-on-error: true
        env:
          EXPECTED_DATE: ${{ inputs.date }}
        shell: bash
        run: |
          set -euo pipefail
          expected="${EXPECTED_DATE:-$(TZ=Asia/Singapore date +%F)}"
          base="https://patshin.github.io/global-market-daily"
          for attempt in 1 2 3; do
            if curl -fsSL --max-time 20 "$base/data/latest.json?watchdog=${GITHUB_RUN_ID}-${attempt}" -o /tmp/public-latest.json; then
              if python3 - "$expected" <<'PY'
          import json, sys
          expected = sys.argv[1]
          latest = json.load(open('/tmp/public-latest.json', encoding='utf-8'))
          assert latest.get('date') == expected, (latest.get('date'), expected)
          assert latest.get('edition_status') == 'provisional', latest.get('edition_status')
          print(f"PUBLIC MORNING VERIFIED: {expected}")
          PY
              then exit 0; fi
            fi
            sleep 5
          done
          exit 1

      - name: Auto-recover stale public morning from current main
        if: steps.main_state.outcome == 'success' && steps.public_state.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::warning::Morning exists in main but Pages is stale. Dispatching direct Pages recovery and independent 30D retry."
          gh workflow run pages.yml --repo "$REPO" --ref main
          gh workflow run trends-refresh.yml --repo "$REPO" --ref main
          echo "RECOVERY DISPATCHED: pages.yml + trends-refresh.yml"

      - name: Fail visibly if morning never reached main
        if: steps.main_state.outcome != 'success'
        shell: bash
        run: |
          echo "::error::Expected morning publication is not present in main. GitHub recovery cannot synthesize missing research; the ChatGPT publisher/PR handoff requires intervention."
          exit 1

  verify-close:
    name: Verify 18:00 SGT close publication
    if: >-
      (github.event_name == 'schedule' && (github.event.schedule == '45 10 * * *' || github.event.schedule == '10 11 * * *')) ||
      (github.event_name == 'workflow_dispatch' && inputs.cycle == 'close')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Validate automation definitions
        run: python scripts/validate_automation_contract.py .

      - name: Verify close publication state in main
        id: main_state
        continue-on-error: true
        env:
          EXPECTED_DATE: ${{ inputs.date }}
        run: |
          args=(--root . --cycle close)
          if [ -n "${EXPECTED_DATE:-}" ]; then args+=(--date "$EXPECTED_DATE"); fi
          python scripts/verify_scheduled_publication.py "${args[@]}"

      - name: Verify close is live on public Pages
        id: public_state
        if: steps.main_state.outcome == 'success'
        continue-on-error: true
        env:
          EXPECTED_DATE: ${{ inputs.date }}
        shell: bash
        run: |
          set -euo pipefail
          expected="${EXPECTED_DATE:-$(TZ=Asia/Singapore date +%F)}"
          base="https://patshin.github.io/global-market-daily"
          for attempt in 1 2 3; do
            if curl -fsSL --max-time 20 "$base/data/latest.json?watchdog=${GITHUB_RUN_ID}-${attempt}" -o /tmp/public-latest.json; then
              if python3 - "$expected" <<'PY'
          import json, sys
          expected = sys.argv[1]
          latest = json.load(open('/tmp/public-latest.json', encoding='utf-8'))
          assert latest.get('date') == expected, (latest.get('date'), expected)
          assert latest.get('edition_status') == 'official', latest.get('edition_status')
          assert latest.get('publication_cycle') in ('close', 'evening'), latest.get('publication_cycle')
          print(f"PUBLIC CLOSE VERIFIED: {expected}")
          PY
              then exit 0; fi
            fi
            sleep 5
          done
          exit 1

      - name: Auto-recover stale public close from current main
        if: steps.main_state.outcome == 'success' && steps.public_state.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          echo "::warning::Close exists in main but Pages is stale. Dispatching direct Pages recovery and independent 30D retry."
          gh workflow run pages.yml --repo "$REPO" --ref main
          gh workflow run trends-refresh.yml --repo "$REPO" --ref main
          echo "RECOVERY DISPATCHED: pages.yml + trends-refresh.yml"

      - name: Fail visibly if close never reached main
        if: steps.main_state.outcome != 'success'
        shell: bash
        run: |
          echo "::error::Expected close publication is not present in main. GitHub recovery cannot synthesize missing research; the ChatGPT publisher/PR handoff requires intervention."
          exit 1
