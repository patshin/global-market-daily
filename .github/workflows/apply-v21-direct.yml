name: Apply v2.1 Direct Repair

on:
  push:
    branches: [release/trend-schedule-v2.1]
    paths:
      - ".github/workflows/apply-v21-direct.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Apply user-facing copy, policy overlay and schedule contracts
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/repair.py <<'PY'
          from __future__ import annotations
          import json, re, textwrap
          from pathlib import Path

          root = Path('.')
          trends = root / 'docs/trends.html'
          html = trends.read_text(encoding='utf-8')

          replacements = {
            '把每天的 Market Regime、Top Catalyst、Persistent Risk 与跨资产价格验证放到同一条时间轴上。原生日判断与历史价格重建严格分开，避免用今天的结果倒推过去的新闻叙事。': '回看过去30日的市场状态、核心催化剂、持续风险与跨资产验证。',
            '离散状态，不使用黑箱综合分数。粗酒红下划线代表当天存在原生 GMD 日报。': '过去30日市场状态及关键切换。',
            'Growth / Inflation / Rates / Earnings / Liquidity / Geopolitics 六条信号与同一交易日对齐。': '六项核心信号的日度方向变化。',
            '横轴是日期，纵轴是稳定主题类别；圆点中的数字是当天 Rank，大小代表 Importance。': '过去30日进入市场核心视野的催化剂与政策节点。',
            '30-day catalyst map': '',
            '衡量的是进入 Top 3 的持续性与生命周期，而不是人为制造的 0–100 风险分。': '持续出现、升级或缓解的核心风险主题。',
            '每个资产独立小图，避免多轴混乱。价格共振仅作为 Narrative confirmation/divergence evidence，不等同于因果证明。': '主要资产对当前市场主线的验证与背离。',
          }
          for old, new in replacements.items():
              html = html.replace(old, new)
          # Remove empty paragraphs left by deleted captions.
          html = re.sub(r'<p[^>]*>\s*</p>', '', html)
          # Keep a compact legend instead of implementation commentary.
          html = html.replace('Native Daily', '原生日报')
          html = html.replace('Market Reconstruction', '市场回溯')
          trends.write_text(html, encoding='utf-8')

          # Create an official-policy monitor. The builder/enricher may refresh this file;
          # an explicit empty state is preferable to a misleading blank lane.
          policy_path = root / 'docs/data/trends/policy-events.json'
          policy_path.parent.mkdir(parents=True, exist_ok=True)
          if policy_path.exists():
              try:
                  policy = json.loads(policy_path.read_text(encoding='utf-8'))
              except Exception:
                  policy = {}
          else:
              policy = {}
          policy.setdefault('schema_version', '1.0.0')
          policy.setdefault('source_policy', 'Primary government and regulator releases only')
          policy.setdefault('events', [])
          policy.setdefault('monitored_categories', ['china_trade_policy'])
          policy.setdefault('empty_state', '本窗口无入选 Top 3 的中国、贸易或产业政策催化剂')
          policy_path.write_text(json.dumps(policy, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          # Add a deterministic overlay stage. Confirmed policy milestones are marked P;
          # they do not impersonate a ranked Top-3 item.
          enrich = root / 'scripts/enrich_policy_events.py'
          enrich.write_text(textwrap.dedent(r'''
              #!/usr/bin/env python3
              from __future__ import annotations
              import json
              from pathlib import Path

              ROOT = Path(__file__).resolve().parents[1]
              LENS = ROOT / "docs/data/trends/rolling-30d.json"
              POLICY = ROOT / "docs/data/trends/policy-events.json"

              def load(path):
                  return json.loads(path.read_text(encoding="utf-8"))

              def main():
                  lens = load(LENS)
                  policy = load(POLICY)
                  days = lens.get("days", [])
                  by_date = {d.get("date"): d for d in days if isinstance(d, dict)}
                  accepted = []
                  for event in policy.get("events", []):
                      if not isinstance(event, dict):
                          continue
                      date = event.get("date")
                      day = by_date.get(date)
                      if not day:
                          continue
                      item = {
                          "id": event.get("id") or f"policy-{date}",
                          "rank": "P",
                          "marker_type": "confirmed_policy",
                          "importance": event.get("importance", 4),
                          "theme_id": event.get("theme_id", "china_trade_policy"),
                          "category": "china_trade_policy",
                          "title": event.get("title", "Policy milestone"),
                          "event": event.get("title", "Policy milestone"),
                          "status": event.get("status", "Confirmed / Released"),
                          "market_bias": event.get("market_bias", "mixed"),
                          "evidence": event.get("evidence", ""),
                          "transmission": event.get("transmission", ""),
                          "confirmation": event.get("confirmation", ""),
                          "invalidation": event.get("invalidation", ""),
                          "source_url": event.get("source_url"),
                          "source_name": event.get("source_name"),
                          "provenance": "primary_policy_source"
                      }
                      bucket = day.setdefault("catalysts", [])
                      if not any(str(x.get("id")) == str(item["id"]) for x in bucket if isinstance(x, dict)):
                          bucket.append(item)
                      accepted.append(item)
                  lens["policy_monitor"] = {
                      "category": "china_trade_policy",
                      "events_in_window": len(accepted),
                      "empty_state": policy.get("empty_state", "本窗口无重大政策节点"),
                      "marker": "P",
                      "marker_label": "已确认政策节点"
                  }
                  LENS.write_text(json.dumps(lens, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
                  print(json.dumps(lens["policy_monitor"], ensure_ascii=False))

              if __name__ == "__main__":
                  main()
          ''').lstrip(), encoding='utf-8')
          enrich.chmod(0o755)

          # Patch the trend renderer with a visible lane state / policy marker legend.
          js_path = root / 'docs/assets/trends.js'
          js = js_path.read_text(encoding='utf-8')
          marker = '/* v2.1 policy-lane state */'
          if marker not in js:
              js += r'''

          /* v2.1 policy-lane state */
          (() => {
            const DATA_PATH = "data/trends/rolling-30d.json";
            const renderPolicyState = async () => {
              try {
                const response = await fetch(`${DATA_PATH}?v=2.1.0`, { cache: "no-store" });
                if (!response.ok) return;
                const data = await response.json();
                const monitor = data.policy_monitor;
                if (!monitor) return;
                const section = document.querySelector("#catalysts")?.closest("section") || document.querySelector("#catalysts");
                if (!section || section.querySelector(".policy-lane-state")) return;
                const box = document.createElement("div");
                box.className = "policy-lane-state";
                const count = Number(monitor.events_in_window || 0);
                box.innerHTML = count > 0
                  ? `<strong>China / Trade / Industrial Policy</strong><span>${count} 个已确认政策节点 · P 为政策节点</span>`
                  : `<strong>China / Trade / Industrial Policy</strong><span>${monitor.empty_state || "本窗口无入选 Top 3 的政策催化剂"}</span>`;
                section.appendChild(box);
              } catch (_) {
                // Core trend page remains available if this non-critical annotation fails.
              }
            };
            if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", renderPolicyState);
            else renderPolicyState();
          })();
          '''
          js_path.write_text(js, encoding='utf-8')

          css_path = root / 'docs/assets/market-lens.css'
          css = css_path.read_text(encoding='utf-8')
          if '.policy-lane-state' not in css:
              css += '''\n.policy-lane-state{display:flex;justify-content:space-between;gap:18px;margin:18px 0 0;padding:12px 14px;border-top:1px solid var(--hairline);border-bottom:1px solid var(--hairline);font-size:.82rem}.policy-lane-state strong{font-family:var(--serif);font-size:.92rem}.policy-lane-state span{color:var(--muted);text-align:right}@media(max-width:560px){.policy-lane-state{display:block}.policy-lane-state span{display:block;margin-top:4px;text-align:left}}\n'''
          css_path.write_text(css, encoding='utf-8')

          # Version and cache busting.
          version_path = root / 'docs/version.json'
          version = json.loads(version_path.read_text(encoding='utf-8'))
          version['site_version'] = '2.1.0'
          version['release_state'] = 'production'
          features = version.setdefault('published_features', [])
          for feature in ['policy_event_monitor', 'concise_user_facing_trend_copy', 'twice_daily_publication_contract']:
              if feature not in features: features.append(feature)
          version['updated_at'] = '2026-09-03T14:10:00+08:00'
          version_path.write_text(json.dumps(version, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          index_path = root / 'docs/index.html'
          index = index_path.read_text(encoding='utf-8')
          index = re.sub(r'(assets/p0\.js\?v=)[^"\']+', r'\g<1>2.1.0', index)
          index = re.sub(r'(assets/market-lens\.css\?v=)[^"\']+', r'\g<1>2.1.0', index)
          index_path.write_text(index, encoding='utf-8')
          html = trends.read_text(encoding='utf-8')
          html = re.sub(r'(assets/trends\.js\?v=)[^"\']+', r'\g<1>2.1.0', html)
          html = re.sub(r'(assets/market-lens\.css\?v=)[^"\']+', r'\g<1>2.1.0', html)
          trends.write_text(html, encoding='utf-8')

          # User-visible publication contract. This is a workflow schedule; the model/API
          # credential remains an explicit prerequisite and is never silently faked.
          contract = root / 'docs/product/daily-publication-contract.md'
          contract.write_text(textwrap.dedent('''
              # Global Market Daily — Twice-Daily Publication Contract

              - Timezone: Asia/Singapore
              - Morning edition: 09:00 SGT; refreshes the current website edition.
              - Evening edition: 18:00 SGT; becomes the official daily archive for that date.
              - Morning and evening runs independently repeat web research, verification, analysis, JSON, Markdown, sources and quality gates.
              - The 18:00 edition overwrites the same date key and is the only edition retained in `archive.json` as the official daily record.
              - A failed partial publication must not advance `latest.json`.
              - GitHub Actions cannot invoke an interactive ChatGPT conversation. Automated research requires a callable model API credential in repository secrets.
              - Model is configurable through repository variable `GMD_MODEL`; reasoning effort through `GMD_REASONING_EFFORT`.
          ''').lstrip(), encoding='utf-8')
          PY
          python3 /tmp/repair.py

      - name: Rebuild and run deterministic audit
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_market_lens.py
          python3 scripts/enrich_policy_events.py
          python3 scripts/validate_publish.py --root .
          python3 scripts/validate_frontend.py --root .
          python3 scripts/validate_market_lens.py
          node --check docs/assets/app.js
          node --check docs/assets/p0.js
          node --check docs/assets/trends.js
          python3 - <<'PY'
          from pathlib import Path
          import json
          html=Path('docs/trends.html').read_text()
          banned=[
            '离散状态，不使用黑箱综合分数',
            'Growth / Inflation / Rates / Earnings / Liquidity / Geopolitics 六条信号',
            '横轴是日期，纵轴是稳定主题类别',
            '衡量的是进入 Top 3 的持续性',
            '每个资产独立小图，避免多轴混乱'
          ]
          assert not any(x in html for x in banned), [x for x in banned if x in html]
          lens=json.loads(Path('docs/data/trends/rolling-30d.json').read_text())
          assert 'policy_monitor' in lens
          assert lens['policy_monitor']['category']=='china_trade_policy'
          assert 'risk_score' not in Path('scripts/build_market_lens.py').read_text(), 'black-box risk_score remains'
          assert '22 个交易日' not in Path('docs/assets/p0.js').read_text(), 'hard-coded session count remains'
          print('V2.1 PRODUCT COPY AND POLICY GATE PASSED')
          PY

      - name: Commit repaired product branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs scripts
          git reset .github/workflows/apply-v21-direct.yml 2>/dev/null || true
          if git diff --cached --quiet; then
            echo 'No product changes to commit' >&2
            exit 1
          fi
          git commit -m "fix(site): clarify trend UX and policy category"
          git push origin HEAD:release/trend-schedule-v2.1
