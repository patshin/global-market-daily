name: Finalize 30D Market Lens v2 R4

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-30d-market-lens-r4.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-30d-market-lens-v2
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run compatible idempotent finalizer
        run: python3 bootstrap/lens-v2/finalize_v4.py

      - name: Run real desktop and mobile browser smoke
        run: bash scripts/browser_smoke.sh .

      - name: Clean migration-only files
        shell: bash
        run: |
          set -euo pipefail
          find .github/workflows -maxdepth 1 -type f \
            ! -name 'pages.yml' \
            ! -name 'quality.yml' \
            ! -name 'trends-refresh.yml' \
            ! -name 'apply-30d-market-lens-r4.yml' \
            -delete
          rm -f .github/workflows/apply-30d-market-lens-r4.yml
          rm -rf bootstrap

      - name: Commit clean production release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Production state already complete."
            exit 0
          fi
          git commit -m "feat(site): launch 30-day market lens and P0 intelligence"
          git pull --rebase origin main
          git push origin HEAD:main
