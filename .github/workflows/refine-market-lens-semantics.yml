name: Refine Market Lens Theme Semantics

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refine-market-lens-semantics.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refine-market-lens-semantics
  cancel-in-progress: true

jobs:
  refine-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Refine title-first theme classification and directional risk states
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          path = Path('scripts/build_market_lens.py')
          text = path.read_text()

          old = '''        combined = " ".join(str(item.get(key, "")) for key in ("event", "what_happened", "transmission", "affected_assets"))
                  theme_id = item.get("theme_id") or infer_native_theme(combined)'''
          new = '''        title_text = str(item.get("event", ""))
                  combined = " ".join(str(item.get(key, "")) for key in ("event", "what_happened", "transmission", "affected_assets"))
                  title_theme = infer_native_theme(title_text)
                  theme_id = item.get("theme_id") or (title_theme if title_theme != "market_structure" else infer_native_theme(combined))'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'title_theme = infer_native_theme(title_text)' not in text:
              raise RuntimeError('native catalyst classification target not found')

          old = '''        combined = " ".join(str(item.get(key, "")) for key in ("risk", "transmission", "first_asset"))
                  theme_id = item.get("theme_id") or infer_native_theme(combined)'''
          new = '''        title_text = str(item.get("risk", ""))
                  combined = " ".join(str(item.get(key, "")) for key in ("risk", "transmission", "first_asset"))
                  title_theme = infer_native_theme(title_text)
                  theme_id = item.get("theme_id") or (title_theme if title_theme != "market_structure" else infer_native_theme(combined))'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'title_text = str(item.get("risk", ""))' not in text:
              raise RuntimeError('native risk classification target not found')

          old = '''def reconstruct_risks(catalysts: list[dict[str, Any]]) -> list[dict[str, Any]]:
              return [
                  {
                      "rank": index + 1,
                      "theme_id": item["theme_id"],
                      "risk": THEMES[item["theme_id"]]["risk_label"],
                      "state": "market_implied",
                      "first_asset": item["primary_asset"],
                      "trigger": item["confirmation"],
                      "transmission": item["transmission"],
                      "source_mode": "objective_market_reconstruction",
                  }
                  for index, item in enumerate(catalysts)
              ]'''
          new = '''def reconstruct_risks(catalysts: list[dict[str, Any]]) -> list[dict[str, Any]]:
              output = []
              for index, item in enumerate(catalysts):
                  risk_off = "risk_off" in str(item.get("market_bias", "")).lower()
                  theme = THEMES[item["theme_id"]]
                  output.append({
                      "rank": index + 1,
                      "theme_id": item["theme_id"],
                      "risk": theme["risk_label"] if risk_off else f"{theme['label_zh']}改善能否持续",
                      "state": "market_implied_risk" if risk_off else "market_implied_easing",
                      "first_asset": item["primary_asset"],
                      "trigger": item["confirmation"],
                      "transmission": item["transmission"],
                      "source_mode": "objective_market_reconstruction",
                  })
              return output'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'market_implied_easing' not in text:
              raise RuntimeError('directional risk reconstruction target not found')

          old = '''        if present_now and len(trailing) == 1:
                      state = "new"'''
          new = '''        latest_bias = str(last_item.get("market_bias", "")).lower()
                  if present_now and "risk_on" in latest_bias:
                      state = "easing"
                  elif present_now and len(trailing) == 1:
                      state = "new"'''
          if old in text:
              text = text.replace(old, new, 1)
          elif 'latest_bias = str(last_item.get("market_bias"' not in text:
              raise RuntimeError('lifecycle direction target not found')

          path.write_text(text)

          daily_path = Path('docs/data/daily/2026-09-02.json')
          if daily_path.exists():
              report = json.loads(daily_path.read_text())
              for item in report.get('top_catalysts', []):
                  title = str(item.get('event', ''))
                  if re.search(r'Dell|Broadcom|NVIDIA|NVDA|AVGO|AI|Semiconductor|半导体|财报', title, re.I):
                      item['theme_id'] = 'ai_earnings'
                      item['category'] = 'earnings_ai_semis'
                  elif re.search(r'Hormuz|Iran|伊朗|航运|油价|原油|中东', title, re.I):
                      item['theme_id'] = 'geopolitics_energy'
                      item['category'] = 'geopolitics_energy'
                  elif re.search(r'Treasury|10Y|JGB|收益率|主权债|债券|期限溢价', title, re.I):
                      item['theme_id'] = 'global_duration'
                      item['category'] = 'inflation_rates'
              for item in report.get('top_risks', []):
                  title = str(item.get('risk', ''))
                  if re.search(r'AI|AVGO|SOX|半导体|资本成本|投入回报', title, re.I):
                      item['theme_id'] = 'ai_earnings'
                      item['category'] = 'earnings_ai_semis'
                  elif re.search(r'Hormuz|Iran|伊朗|航运|油价|原油|中东', title, re.I):
                      item['theme_id'] = 'geopolitics_energy'
                      item['category'] = 'geopolitics_energy'
                  elif re.search(r'Treasury|10Y|JGB|收益率|主权债|债券|期限溢价', title, re.I):
                      item['theme_id'] = 'global_duration'
                      item['category'] = 'inflation_rates'
              daily_path.write_text(json.dumps(report, ensure_ascii=False, indent=2) + '\n')
          PY

      - name: Rebuild and run complete release gates
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_market_lens.py --root . --network
          python3 scripts/validate_publish.py --root .
          python3 scripts/validate_frontend.py --root .
          python3 scripts/validate_market_lens.py --root .
          node --check docs/assets/app.js
          node --check docs/assets/p0.js
          node --check docs/assets/trends.js
          bash scripts/browser_smoke.sh .

      - name: Refresh verified release proof
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          path = Path('docs/release-proof.json')
          proof = json.loads(path.read_text()) if path.exists() else {}
          proof['release'] = '30D Market Lens and P0 Intelligence'
          proof['site_version'] = '2.0.0'
          proof['release_state'] = 'verified_production'
          proof['semantic_refinement'] = 'title_first_theme_classification_and_directional_risk_lifecycle'
          proof['verified_at'] = datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00', 'Z')
          proof['verified_commit_input'] = '${{ github.sha }}'
          proof['coverage'] = json.loads(Path('docs/data/trends/rolling-30d.json').read_text())['coverage']
          path.write_text(json.dumps(proof, ensure_ascii=False, indent=2) + '\n')
          PY
          rm -f .github/workflows/refine-market-lens-semantics.yml

      - name: Commit semantic refinement
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(lens): align catalyst themes and risk lifecycle semantics"
          git pull --rebase origin main
          git push origin HEAD:main
