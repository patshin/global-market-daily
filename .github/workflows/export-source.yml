name: Export Current Source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/export-source.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create source archive
        run: tar --exclude=.git -czf /tmp/global-market-daily-source.tar.gz .

      - name: Upload source archive
        uses: actions/upload-artifact@v7
        with:
          name: global-market-daily-source
          path: /tmp/global-market-daily-source.tar.gz
          if-no-files-found: error
          retention-days: 1
