name: Finalize v2.1 Trend and Schedule Release

on:
  push:
    branches: [work/fix-schedules-copy-audit]
    paths:
      - ".github/workflows/finalize-v21-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sync latest branch state
        shell: bash
        run: |
          set -euo pipefail
          sleep 8
          git fetch origin work/fix-schedules-copy-audit
          git reset --hard origin/work/fix-schedules-copy-audit

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check --quiet "jsonschema>=4.23,<5"

      - name: Apply cache, style and release metadata fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          index = Path('docs/index.html')
          html = index.read_text(encoding='utf-8')
          html = html.replace('assets/market-lens.css?v=2.0.0', 'assets/market-lens.css?v=2.1.0')
          html = html.replace('assets/p0.js?v=2.0.0', 'assets/p0.js?v=2.1.0')
          index.write_text(html, encoding='utf-8')

          css_path = Path('docs/assets/market-lens.css')
          css = css_path.read_text(encoding='utf-8')
          marker = '/* v2.1 reader-facing catalyst states */'
          if marker not in css:
              css += '''\n\n/* v2.1 reader-facing catalyst states */\n.catalyst-empty-label {\n  fill: var(--muted);\n  font-family: var(--sans);\n  font-size: 10px;\n  font-style: italic;\n}\n.source-mode-badge.policy {\n  border-color: rgba(145, 82, 15, .55);\n  color: var(--warning);\n  background: rgba(145, 82, 15, .06);\n}\n.mobile-catalyst {\n  width: 100%;\n  border: 0;\n  border-top: 1px solid var(--hairline);\n  border-radius: 0;\n  color: inherit;\n  background: transparent;\n  font: inherit;\n  text-align: left;\n  cursor: pointer;\n}\n.mobile-catalyst:focus-visible {\n  outline: 2px solid var(--accent);\n  outline-offset: 2px;\n}\n.lens-provenance p {\n  max-width: 920px;\n  color: var(--muted);\n  font-family: var(--serif);\n  line-height: 1.65;\n}\n'''
          css_path.write_text(css, encoding='utf-8')

          proof_path = Path('docs/release-proof.json')
          if proof_path.exists():
              proof = json.loads(proof_path.read_text(encoding='utf-8'))
              proof['site_version'] = '2.1.0'
              proof['release_state'] = 'production'
              proof['verified_features'] = sorted(set(proof.get('verified_features', []) + [
                  'china_trade_policy_ingestion',
                  'reader_facing_trend_copy',
                  'twice_daily_publication_contract',
                  'eod_only_native_archive',
              ]))
              proof_path.write_text(json.dumps(proof, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Build current 30D output
        run: python scripts/build_market_lens.py

      - name: Run full release gates
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/build_market_lens.py scripts/generate_daily_with_openai.py scripts/validate_v21_contract.py
          python scripts/validate_publish.py --root .
          python scripts/validate_frontend.py --root .
          python scripts/validate_market_lens.py
          python scripts/validate_v21_contract.py
          node --check docs/assets/app.js
          node --check docs/assets/p0.js
          node --check docs/assets/trends.js
          python scripts/generate_daily_with_openai.py --help >/dev/null
          grep -q 'assets/p0.js?v=2.1.0' docs/index.html
          grep -q 'assets/trends.js?v=2.1.0' docs/trends.html

      - name: Commit finalized non-workflow files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs scripts prompts
          if git diff --cached --quiet; then
            echo "No finalization changes"
            exit 0
          fi
          git commit -m "fix(site): finalize China catalysts, copy and publication contract"
          git pull --rebase origin work/fix-schedules-copy-audit
          git push origin HEAD:work/fix-schedules-copy-audit
