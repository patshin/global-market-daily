name: Refresh 30D Market Lens

on:
  push:
    branches: [main]
    paths:
      - "docs/data/daily/*.json"
      - "docs/data/latest.json"
      - "scripts/build_market_lens.py"
      - "scripts/validate_market_lens.py"
      - ".github/workflows/trends-refresh.yml"
  schedule:
    - cron: "35 23 * * 0-4"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: trends-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build official/public market-history layer
        id: build_lens
        continue-on-error: true
        run: python scripts/build_market_lens.py

      - name: Validate 30D lens
        id: validate_lens
        if: steps.build_lens.outcome == 'success'
        continue-on-error: true
        run: python scripts/validate_market_lens.py

      - name: Commit derived trend data when valid and changed
        if: steps.build_lens.outcome == 'success' && steps.validate_lens.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/trends/market-history.json docs/data/trends/rolling-30d.json docs/data/trends/theme-registry.json
          if git diff --cached --quiet; then
            echo "30D derived data already current"
          else
            git commit -m "data: refresh rolling 30D market lens"
            git push origin HEAD:main
          fi

      - name: Dispatch Pages from current main regardless of 30D outcome
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # The daily publication is primary. If 30D derivation fails, Pages
          # must still deploy current main with the last-known-good derived lens.
          gh workflow run pages.yml --repo "$REPO" --ref main
          echo "DISPATCHED Deploy Global Market Daily on main"

      - name: Surface 30D failure after publication recovery handoff
        if: always() && (steps.build_lens.outcome != 'success' || steps.validate_lens.outcome != 'success')
        shell: bash
        run: |
          echo "::error::30D refresh failed, but Pages recovery was dispatched from current main."
          echo "build_outcome=${{ steps.build_lens.outcome }}"
          echo "validate_outcome=${{ steps.validate_lens.outcome }}"
          exit 1
