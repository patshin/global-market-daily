# Bootstrap trigger: 2026-09-02-r2
name: Bootstrap Global Market Daily

on:
  push:
    branches: [main]
    paths:
      - "bootstrap/**"
      - ".github/workflows/bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gmd-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out current main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Reassemble and verify publication bundle
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/bundle.b64.part-* > /tmp/gmd-bundle.b64
          test "$(wc -c < /tmp/gmd-bundle.b64 | tr -d ' ')" = "50104"
          echo "51f9ac7c6ec2da300f03bcc416c92ab29a9030ff2615959e964b8526c3f1003c  /tmp/gmd-bundle.b64" | sha256sum --check --strict
          base64 --decode /tmp/gmd-bundle.b64 > /tmp/gmd-bundle.tar.xz
          test "$(wc -c < /tmp/gmd-bundle.tar.xz | tr -d ' ')" = "37576"
          echo "65e65063831a0c31120dee0d55d2cff238197f55e7f874454292288e6051c60b  /tmp/gmd-bundle.tar.xz" | sha256sum --check --strict

      - name: Expand website and publication files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/gmd-final
          tar -xJf /tmp/gmd-bundle.tar.xz -C /tmp/gmd-final
          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/workflows/' \
            /tmp/gmd-final/ ./

      - name: Run deterministic publication gate
        run: python3 scripts/validate_publish.py --root .

      - name: Commit website and first edition
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A README.md docs schemas scripts bootstrap
          if git diff --cached --quiet; then
            echo "No bootstrap changes to commit."
            exit 0
          fi
          git commit -m "daily: publish market brief 2026-09-02"
          git push origin HEAD:main
