name: Migrate 2026-09-03 renderer contract

on:
  push:
    branches: [fix/historical-render-contract]
    paths:
      - ".github/workflows/migrate-0903-render-contract.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Canonicalize archived 2026-09-03 renderer fields
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          path=Path('docs/data/daily/2026-09-03.json')
          r=json.loads(path.read_text())

          r['scenario_matrix']={
            'base_case': {
              'label':'Base Case',
              'probability':'主情景，不给出虚假精确概率',
              'trigger':'Hormuz风险持续但不演变为全面封锁；美国就业显示温和放缓而非崩塌；UST 10Y维持高位但不突破5%。',
              'expected_market_reaction':'AI基本面继续支撑科技，但油价和利率限制估值扩张；指数偏震荡，能源与部分AI基础设施相对占优。',
              'assets_most_sensitive':['Brent','UST 10Y','Nasdaq/SOX','DXY'],
              'what_confirms_it':'Brent维持高位但未进一步失控、10Y不突破5%，且就业和后续AI财报没有出现明显负面断点。',
              'what_invalidates_it':'Hormuz商业航运显著恶化并推动Brent突破100美元，或就业/通胀重新强化紧缩定价并使10Y突破5%。'
            },
            'bull_case': {
              'label':'Bull Case',
              'probability':'条件情景，不给出虚假精确概率',
              'trigger':'冲突实质降级、Brent快速回落；就业温和偏弱使Fed紧缩概率下降；AI财报继续上修。',
              'expected_market_reaction':'UST收益率和美元回落，高久期科技与广义风险资产重新获得估值支撑。',
              'assets_most_sensitive':['Nasdaq 100','SOX','UST 10Y','DXY','Gold'],
              'what_confirms_it':'Brent明显回落、10Y继续下行，且就业数据温和降温而AI收入和指引继续上修。',
              'what_invalidates_it':'新增实体供应中断使能源再通胀升级，或就业/通胀数据重新推高政策利率和期限溢价。'
            },
            'bear_case': {
              'label':'Bear Case',
              'probability':'尾部情景，不给出虚假精确概率',
              'trigger':'Hormuz商业航运进一步中断、Brent突破100美元；就业/工资或后续通胀强化紧缩预期；10Y重新冲击5%。',
              'expected_market_reaction':'全球债券和高久期股票承压，美元与能源风险溢价上升，信用条件进一步收紧。',
              'assets_most_sensitive':['Brent','UST 10Y','Nasdaq/SOX','DXY','High Yield Credit'],
              'what_confirms_it':'Brent持续突破100美元、10Y向5%上方延伸，且VIX与信用利差同步扩大。',
              'what_invalidates_it':'可信停火和航运恢复使油价快速回落，或就业显著降温迫使Fed紧缩定价明显逆转。'
            }
          }

          r['next_catalyst']['watch_first']=['UST 2Y','DXY','Nasdaq futures']

          by_ticker={e.get('ticker'):e for e in r['sections']['earnings'].get('reported',[])}
          if 'AVGO' in by_ticker:
            e=by_ticker['AVGO']
            e['guidance']=[
              {'metric':'FY2027 AI chip revenue','current':'~$115B','previous_or_consensus':'New long-range management outlook','change':'New outlook','interpretation':'AI accelerator and networking demand remains on a very high growth path.'},
              {'metric':'FY2028 AI chip revenue','current':'~$230B','previous_or_consensus':'New long-range management outlook','change':'New outlook','interpretation':'Management is signaling multi-year AI infrastructure demand rather than a one-quarter spike.'},
              {'metric':'Q4 FY2026 revenue','current':'~$34.8B','previous_or_consensus':'Market expectation ~ $35.03B','change':'Slightly below high market bar','interpretation':'Strong fundamentals remain intact, but near-term upside must clear unusually elevated expectations.'}
            ]
            e['read_through']=[
              {'asset':'Custom AI accelerators / networking','implication':'Demand remains broad beyond a single hyperscaler or accelerator vendor.'},
              {'asset':'AI infrastructure suppliers','implication':'AI capex is continuing to translate into supplier revenue and backlog.'},
              {'asset':'AVGO valuation','implication':'The key risk is increasingly expectation and valuation rather than absence of AI demand.'}
            ]
          if 'SNOW' in by_ticker:
            e=by_ticker['SNOW']
            e['guidance']=[
              {'metric':'FY2027 product revenue','current':'$6.07B','previous_or_consensus':'Prior company guide $5.84B','change':'+$0.23B','interpretation':'The raised outlook supports continued enterprise data-platform consumption tied to AI workloads.'}
            ]
            e['read_through']=[
              {'asset':'Cloud data platforms','implication':'Enterprise AI workloads are increasing consumption of core data infrastructure.'},
              {'asset':'AI software beneficiaries','implication':'Software and data-platform beneficiaries can coexist with hardware capex winners.'}
            ]
          if 'HPE' in by_ticker:
            e=by_ticker['HPE']
            e['guidance']=[
              {'metric':'FY2026 non-GAAP EPS','current':'$3.75-$3.85','previous_or_consensus':'Prior company guide was lower; exact prior range not independently re-queried','change':'Raised','interpretation':'Higher EPS guidance broadens the evidence that AI and networking demand is reaching enterprise infrastructure suppliers.'},
              {'metric':'Q4 revenue','current':'$13.9B-$14.8B','previous_or_consensus':'Company Q4 outlook','change':'New quarterly guide','interpretation':'The outlook and record backlog support multi-quarter infrastructure visibility.'}
            ]
            e['read_through']=[
              {'asset':'Enterprise infrastructure / networking','implication':'AI capex beneficiaries are broadening beyond hyperscaler semiconductor suppliers.'},
              {'asset':'HPE backlog','implication':'Record backlog supports multi-quarter revenue visibility.'}
            ]

          path.write_text(json.dumps(r,ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Validate all current and archived renderer contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_publish_v2.py --root .
          python3 scripts/validate_live_contract.py --root .
          python3 scripts/validate_archive_live_contract.py --root .
          python3 scripts/validate_frontend.py --root .
          python3 scripts/validate_market_lens.py
          node --check docs/assets/app.js
          node --check docs/assets/publication-compat.js
          node --check docs/assets/p0.js
          node --check docs/assets/trends.js

      - name: Commit canonical historical data only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/daily/2026-09-03.json
          git reset .github/workflows/migrate-0903-render-contract.yml 2>/dev/null || true
          git commit -m "fix(data): canonicalize 2026-09-03 historical renderer contract"
          git push origin HEAD:fix/historical-render-contract
