name: Finalize Market Lens Refresh Schedule

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/finalize-refresh-schedule.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize-schedule:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Align fallback refresh to 07:30 SGT
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/trends-refresh.yml')
          text = path.read_text()
          text = text.replace('cron: "30 4 * * 1-6"', 'cron: "30 23 * * 0-5"')
          path.write_text(text)
          PY
          rm -f .github/workflows/finalize-refresh-schedule.yml

      - name: Commit schedule hardening
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/trends-refresh.yml .github/workflows/finalize-refresh-schedule.yml
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ci: align Market Lens refresh to 07:30 SGT"
          git pull --rebase origin main
          git push origin HEAD:main
