name: Apply Cross-Section Event Collections v1.3.0

on:
  push:
    branches: [main]
    paths:
      - "bootstrap/event-collections-v13/**"
      - ".github/workflows/event-collections-v13.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gmd-event-collections-v13
  cancel-in-progress: false

jobs:
  apply-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Reassemble and inspect release bundle
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/event-collections-v13/bundle.b64.part-* > /tmp/gmd-event-collections-v13.b64
          echo "Base64 size: $(wc -c < /tmp/gmd-event-collections-v13.b64 | tr -d ' ')"
          sha256sum /tmp/gmd-event-collections-v13.b64
          base64 --decode /tmp/gmd-event-collections-v13.b64 > /tmp/gmd-event-collections-v13.tar.xz
          echo "Archive size: $(wc -c < /tmp/gmd-event-collections-v13.tar.xz | tr -d ' ')"
          sha256sum /tmp/gmd-event-collections-v13.tar.xz
          xz --test /tmp/gmd-event-collections-v13.tar.xz
          tar -tJf /tmp/gmd-event-collections-v13.tar.xz | tee /tmp/gmd-event-collections-v13.files
          for required in \
            README.md \
            docs/index.html \
            docs/assets/app.js \
            docs/assets/styles.css \
            docs/data/daily/2026-09-02.json \
            docs/version.json \
            schemas/daily.schema.json \
            scripts/validate_publish.py \
            scripts/validate_frontend.py; do
            grep -Fxq "$required" /tmp/gmd-event-collections-v13.files
          done

      - name: Apply production files
        run: tar -xJf /tmp/gmd-event-collections-v13.tar.xz -C .

      - name: Run deterministic publication and frontend gates
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_publish.py --root .
          python3 scripts/validate_frontend.py --root .
          python3 -m json.tool docs/data/daily/2026-09-02.json >/dev/null
          python3 -m json.tool schemas/daily.schema.json >/dev/null
          node --check docs/assets/app.js
          git diff --check

      - name: Verify the unbounded multi-event contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')
          report = json.loads((root / 'docs/data/daily/2026-09-02.json').read_text(encoding='utf-8'))
          schema = json.loads((root / 'schemas/daily.schema.json').read_text(encoding='utf-8'))
          app = (root / 'docs/assets/app.js').read_text(encoding='utf-8')

          keys = [
              'us_macro', 'central_banks', 'geopolitics', 'regional_policy',
              'index_changes', 'flows', 'etf', 'options', 'treasury',
              'commodities', 'financing', 'breaking_news',
          ]
          total_groups = 0
          total_events = 0
          for key in keys:
              section = report['sections'][key]
              groups = section.get('event_groups')
              assert isinstance(groups, list) and groups, f'{key}: event_groups missing'
              total_groups += len(groups)
              for group in groups:
                  assert isinstance(group.get('items'), list), f'{key}/{group.get("id")}: items is not an array'
                  total_events += len(group['items'])

          event_group = schema['$defs']['eventGroup']['properties']['items']
          assert event_group.get('type') == 'array'
          assert 'maxItems' not in event_group, 'generic event items must be unbounded'
          assert schema['properties']['top_catalysts']['maxItems'] == 3
          assert 'group.items.forEach((item, index)' in app
          assert 'renderSectionEventGroups' in app
          assert total_groups == 22, total_groups
          assert total_events == 22, total_events
          print(f'EVENT COLLECTION CONTRACT PASSED — {total_groups} groups, {total_events} current events, no maxItems')
          PY

      - name: Commit tested production release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            README.md \
            docs/index.html \
            docs/assets/app.js \
            docs/assets/styles.css \
            docs/data/daily/2026-09-02.json \
            docs/version.json \
            schemas/daily.schema.json \
            scripts/validate_publish.py \
            scripts/validate_frontend.py
          if git diff --cached --quiet; then
            echo "No production changes to commit."
            exit 0
          fi
          git commit -m "fix(data): generalize core sections to unbounded event collections"
          git push origin HEAD:main
