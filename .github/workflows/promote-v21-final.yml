name: Promote Verified v2.1 Product to Clean Release

on:
  push:
    branches: [work/fix-schedules-copy-audit]
    paths:
      - ".github/workflows/promote-v21-final.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Sync latest work branch
        shell: bash
        run: |
          set -euo pipefail
          sleep 12
          git fetch origin work/fix-schedules-copy-audit release/v2.1-production
          git reset --hard origin/work/fix-schedules-copy-audit

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check --quiet "jsonschema>=4.23,<5"

      - name: Enforce final product metadata and rebuild
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          builder=Path('scripts/build_market_lens.py')
          text=builder.read_text(encoding='utf-8').replace("'pboC'", "'pboc'")
          builder.write_text(text,encoding='utf-8')

          index=Path('docs/index.html')
          html=index.read_text(encoding='utf-8')
          html=html.replace('assets/market-lens.css?v=2.0.0','assets/market-lens.css?v=2.1.0')
          html=html.replace('assets/p0.js?v=2.0.0','assets/p0.js?v=2.1.0')
          index.write_text(html,encoding='utf-8')

          css_path=Path('docs/assets/market-lens.css')
          css=css_path.read_text(encoding='utf-8')
          marker='/* v2.1 reader-facing catalyst states */'
          if marker not in css:
              css += '''\n\n/* v2.1 reader-facing catalyst states */\n.catalyst-empty-label { fill: var(--muted); font-family: var(--sans); font-size: 10px; font-style: italic; }\n.source-mode-badge.policy { border-color: rgba(145,82,15,.55); color: var(--warning); background: rgba(145,82,15,.06); }\n.mobile-catalyst { width: 100%; border: 0; border-top: 1px solid var(--hairline); border-radius: 0; color: inherit; background: transparent; font: inherit; text-align: left; cursor: pointer; }\n.mobile-catalyst:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }\n.lens-provenance p { max-width: 920px; color: var(--muted); font-family: var(--serif); line-height: 1.65; }\n'''
          css_path.write_text(css,encoding='utf-8')

          version_path=Path('docs/version.json')
          version=json.loads(version_path.read_text(encoding='utf-8'))
          version['site_version']='2.1.0'
          version['release_state']='production'
          features=set(version.get('published_features',[]))
          features.update(['policy_catalyst_ingestion','twice_daily_publication_contract'])
          version['published_features']=sorted(features)
          version_path.write_text(json.dumps(version,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          python scripts/build_market_lens.py

      - name: Validate work product
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_publish.py --root .
          python scripts/validate_frontend.py --root .
          python scripts/validate_market_lens.py
          python scripts/validate_v21_contract.py
          python -m py_compile scripts/build_market_lens.py scripts/generate_daily_with_openai.py scripts/validate_v21_contract.py
          node --check docs/assets/app.js
          node --check docs/assets/p0.js
          node --check docs/assets/trends.js
          python scripts/generate_daily_with_openai.py --help >/dev/null

      - name: Record verified release candidate
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          lens=json.loads(Path('docs/data/trends/rolling-30d.json').read_text())
          status={
            'status':'verified_release_candidate',
            'site_version':'2.1.0',
            'verified_at_utc':datetime.now(timezone.utc).isoformat(timespec='seconds'),
            'china_trade_policy':lens['category_activity']['china_trade_policy'],
            'market_sessions':lens['coverage']['market_sessions'],
            'scheduled_editions':['09:00 Asia/Singapore morning','18:00 Asia/Singapore eod'],
            'eod_is_official_archive':True,
            'checks':['publication','frontend','market_lens','v2.1_contract','python_syntax','javascript_syntax']
          }
          p=Path('docs/data/automation/v21-validation.json')
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(status,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Copy product files onto clean release branch
        shell: bash
        run: |
          set -euo pipefail
          git add docs scripts prompts
          git diff --cached --binary > /tmp/v21-product.patch
          git reset --hard
          git checkout -B release/v2.1-production origin/release/v2.1-production
          git apply --index /tmp/v21-product.patch
          test -f docs/data/automation/v21-validation.json
          grep -q 'verified_release_candidate' docs/data/automation/v21-validation.json
          grep -q '"site_version": "2.1.0"' docs/version.json
          grep -q 'DEXCHUS' scripts/build_market_lens.py
          test -f scripts/generate_daily_with_openai.py
          test -f prompts/global-market-daily-master.md

      - name: Validate clean release tree
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_publish.py --root .
          python scripts/validate_frontend.py --root .
          python scripts/validate_market_lens.py
          python scripts/validate_v21_contract.py
          python -m py_compile scripts/build_market_lens.py scripts/generate_daily_with_openai.py scripts/validate_v21_contract.py
          node --check docs/assets/app.js
          node --check docs/assets/p0.js
          node --check docs/assets/trends.js

      - name: Commit clean release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --cached --quiet; then
            echo "Clean branch already contains verified product files"
            exit 0
          fi
          git commit -m "fix(site): publish v2.1 trend, policy and automation product"
          git push origin HEAD:release/v2.1-production
