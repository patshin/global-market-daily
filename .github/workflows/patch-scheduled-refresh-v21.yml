name: Patch Scheduled Policy Refresh v2.1

on:
  push:
    branches: [main]
    paths: [".github/workflows/patch-scheduled-refresh-v21.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Make every edition refresh official policy input
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/scheduled_publish.py
          test -f scripts/fetch_policy_events.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/scheduled_publish.py')
          s=p.read_text(encoding='utf-8')
          if 'import subprocess' not in s:
              s=s.replace('import os\n', 'import os\nimport subprocess\n')
          old='''    write_publication(bundle, date, args.edition)\n    print(json.dumps({"date": date, "edition": args.edition, "status": "generated"}, ensure_ascii=False))\n'''
          new='''    write_publication(bundle, date, args.edition)\n\n    # Refresh the official policy input on both editions. Only the evening run\n    # promotes the same date into the official 30D qualitative history.\n    subprocess.run([sys.executable, "scripts/fetch_policy_events.py"], cwd=ROOT, check=True)\n    if args.edition == "evening":\n        subprocess.run([sys.executable, "scripts/build_market_lens.py"], cwd=ROOT, check=True)\n        subprocess.run([sys.executable, "scripts/enrich_policy_events.py"], cwd=ROOT, check=True)\n        subprocess.run([sys.executable, "scripts/validate_market_lens.py"], cwd=ROOT, check=True)\n\n    print(json.dumps({"date": date, "edition": args.edition, "status": "generated"}, ensure_ascii=False))\n'''
          if old in s:
              s=s.replace(old,new)
          elif 'scripts/fetch_policy_events.py' not in s:
              raise SystemExit('Cannot locate publisher main block')
          p.write_text(s,encoding='utf-8')
          PY
          python3 -m py_compile scripts/scheduled_publish.py scripts/fetch_policy_events.py
      - name: Run policy refresh now
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/fetch_policy_events.py
          python3 scripts/build_market_lens.py
          python3 scripts/enrich_policy_events.py
          python3 scripts/validate_market_lens.py
      - name: Commit runtime and policy data
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/scheduled_publish.py docs/data/trends/policy-events.json docs/data/trends/rolling-30d.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(automation): refresh official policy input on scheduled editions"
          git pull --rebase origin main
          git push origin HEAD:main
