name: Validate v2.1 Release Candidate

on:
  push:
    branches: [work/fix-schedules-copy-audit]
    paths:
      - ".github/workflows/v21-release-candidate.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Sync latest branch
        run: |
          sleep 5
          git fetch origin work/fix-schedules-copy-audit
          git reset --hard origin/work/fix-schedules-copy-audit
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --quiet "jsonschema>=4.23,<5"
      - name: Rebuild and validate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_market_lens.py
          python scripts/validate_publish.py --root .
          python scripts/validate_frontend.py --root .
          python scripts/validate_market_lens.py
          python scripts/validate_v21_contract.py
          python -m py_compile scripts/build_market_lens.py scripts/generate_daily_with_openai.py scripts/validate_v21_contract.py
          node --check docs/assets/app.js
          node --check docs/assets/p0.js
          node --check docs/assets/trends.js
          python scripts/generate_daily_with_openai.py --help >/dev/null
      - name: Record verified candidate
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          lens=json.loads(Path('docs/data/trends/rolling-30d.json').read_text())
          status={
            'status':'verified_release_candidate',
            'site_version':'2.1.0',
            'verified_at_utc':datetime.now(timezone.utc).isoformat(timespec='seconds'),
            'china_trade_policy':lens['category_activity']['china_trade_policy'],
            'market_sessions':lens['coverage']['market_sessions'],
            'scheduled_editions':['09:00 Asia/Singapore morning','18:00 Asia/Singapore eod'],
            'eod_is_official_archive':True,
            'checks':['publication','frontend','market_lens','v2.1_contract','python_syntax','javascript_syntax']
          }
          p=Path('docs/data/automation/v21-validation.json')
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(status,ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Commit verified outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/trends docs/data/automation docs/index.html docs/assets/market-lens.css docs/release-proof.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "test: seal v2.1 release candidate"
          git pull --rebase origin work/fix-schedules-copy-audit
          git push origin HEAD:work/fix-schedules-copy-audit
