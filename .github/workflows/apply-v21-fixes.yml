name: Apply v2.1 Trend, Copy and Schedule Fixes

on:
  push:
    branches: [release/trend-schedule-v2.1]
    paths:
      - ".github/workflows/apply-v21-fixes.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Reassemble and verify release payload
        shell: bash
        run: |
          set -euo pipefail
          echo "ccc1b071f9e814eb8ad24b213df9917a4b33776b54b69a956a18434ae55abafc  .release/v2.1/part-00" | sha256sum --check --strict
          echo "46d282322f055bfdd6a66d1048ab7560622e0c4c3726af7f93adbedb4c124f5a  .release/v2.1/part-01" | sha256sum --check --strict
          echo "af22af295c434970388044bccd4ba0c27ddf6ed3777467d17b3ca35564216762  .release/v2.1/part-02" | sha256sum --check --strict
          echo "f4390555fe10f13bd251463fe363f0778995fa3c5d93a9b46ba9d128074c3311  .release/v2.1/part-03" | sha256sum --check --strict
          echo "e5f8d17f3b5d2f9ccbee47034fa74b2b5f38152c062fbebc085160da001f3d5c  .release/v2.1/part-04" | sha256sum --check --strict
          echo "af79b7a17c0a919b7915ed638f39213ba9e5773d6abafc040249958391351fcb  .release/v2.1/rem-00" | sha256sum --check --strict
          echo "6e170e967c909eb1b73d0f0a951dcaff039f98b2f9ed0e6fdf640b5af8abc6b1  .release/v2.1/rem-01" | sha256sum --check --strict
          echo "15acf905cccf037a030f52090342e0fa72c51a86647a2ac6540a5061804323a8  .release/v2.1/rem-02" | sha256sum --check --strict
          echo "ce54976112107d24060f42bb30499019262537a2c3a30be7de1bf33846b293d7  .release/v2.1/rem-03" | sha256sum --check --strict
          cat \
            .release/v2.1/part-00 \
            .release/v2.1/part-01 \
            .release/v2.1/part-02 \
            .release/v2.1/part-03 \
            .release/v2.1/part-04 \
            .release/v2.1/rem-00 \
            .release/v2.1/rem-01 \
            .release/v2.1/rem-02 \
            .release/v2.1/rem-03 > /tmp/gmd-v21.b64
          test "$(wc -c < /tmp/gmd-v21.b64 | tr -d ' ')" = "63080"
          base64 --decode /tmp/gmd-v21.b64 > /tmp/gmd-v21-product.tar.gz
          echo "e81bdd660be49f26f2a9f43dd3a89ecfebaac926663b832e412cb2edd4b959a7  /tmp/gmd-v21-product.tar.gz" | sha256sum --check --strict
          tar -xzf /tmp/gmd-v21-product.tar.gz -C .

      - name: Rebuild market memory
        run: python scripts/build_market_lens.py

      - name: Run product and data gates
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_publish.py --root .
          python scripts/validate_frontend.py --root .
          python scripts/validate_market_lens.py
          python -m py_compile scripts/generate_daily_update.py scripts/build_market_lens.py
          node --check docs/assets/app.js
          node --check docs/assets/p0.js
          node --check docs/assets/trends.js
          git diff --check
          grep -q '"verified_event_days": 5' docs/data/trends/rolling-30d.json
          test "$(grep -c '"category": "china_trade_policy"' docs/data/trends/rolling-30d.json)" -ge 5
          ! grep -Eq '离散状态，不使用黑箱综合分数|粗酒红下划线代表|六条信号与同一交易日对齐|横轴是日期，纵轴是稳定主题类别|衡量的是进入 Top 3 的持续性|每个资产独立小图|不等同于因果证明' docs/trends.html

      - name: Commit verified product files only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md prompts/global-market-daily-master.md \
            scripts/build_market_lens.py scripts/generate_daily_update.py scripts/validate_market_lens.py \
            docs/index.html docs/trends.html docs/version.json \
            docs/assets/market-lens.css docs/assets/p0.js docs/assets/trends.js \
            docs/data/trends/rolling-30d.json docs/data/trends/theme-registry.json docs/data/trends/verified-events.json \
            docs/product/30d-market-lens.md
          if git diff --cached --quiet; then
            echo "No product changes detected."
            exit 1
          fi
          git commit -m "fix(site): complete trend coverage and publication contract"
          git push origin HEAD:release/trend-schedule-v2.1

# rerun after publication workflow was staged
