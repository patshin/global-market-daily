name: Normalize v2.1 Production Workflows

on:
  push:
    branches: [main]
    paths: [".github/workflows/normalize-v21-workflows.yml"]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Normalize official-history refresh
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/workflows/trends-refresh.yml <<'YAML'
          name: Refresh Official 30D Market Lens

          on:
            push:
              branches: [main]
              paths:
                - "docs/data/daily/**"
                - "docs/data/archive.json"
                - "docs/data/trends/policy-events.json"
                - "scripts/build_market_lens.py"
                - "scripts/fetch_policy_events.py"
                - "scripts/enrich_policy_events.py"
                - ".github/workflows/trends-refresh.yml"
            workflow_dispatch:

          permissions:
            contents: write

          concurrency:
            group: official-30d-market-lens
            cancel-in-progress: false

          jobs:
            refresh:
              runs-on: ubuntu-latest
              timeout-minutes: 15
              steps:
                - uses: actions/checkout@v7
                  with:
                    fetch-depth: 0
                - uses: actions/setup-python@v7
                  with:
                    python-version: "3.12"
                - name: Require an official latest edition
                  id: official
                  shell: bash
                  run: |
                    python3 - <<'PY'
                    import json, os
                    from pathlib import Path
                    latest=json.loads(Path('docs/data/latest.json').read_text())
                    official=latest.get('archive_status','official') == 'official'
                    with open(os.environ['GITHUB_OUTPUT'],'a') as f:
                        f.write(f"run={'true' if official else 'false'}\n")
                    print('official history refresh:', official)
                    PY
                - name: Fetch official policy milestones
                  if: steps.official.outputs.run == 'true'
                  run: python3 scripts/fetch_policy_events.py
                - name: Build and validate official history
                  if: steps.official.outputs.run == 'true'
                  shell: bash
                  run: |
                    set -euo pipefail
                    python3 scripts/build_market_lens.py
                    python3 scripts/enrich_policy_events.py
                    python3 scripts/validate_market_lens.py
                - name: Commit refreshed official history
                  if: steps.official.outputs.run == 'true'
                  shell: bash
                  run: |
                    set -euo pipefail
                    git config user.name "github-actions[bot]"
                    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                    git add docs/data/trends
                    if git diff --cached --quiet; then exit 0; fi
                    git commit -m "data: refresh official 30D market lens"
                    git pull --rebase origin main
                    git push origin HEAD:main
          YAML
          git rm -f .github/workflows/normalize-v21-workflows.yml
      - name: Commit normalized workflows
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/trends-refresh.yml .github/workflows/normalize-v21-workflows.yml
          git commit -m "fix(ci): rebuild trends only from official evening editions"
          git pull --rebase origin main
          git push origin HEAD:main
