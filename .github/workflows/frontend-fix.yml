name: Apply Frontend Readability Fix

on:
  push:
    branches: [main]
    paths:
      - "bootstrap/frontend-fix/**"
      - ".github/workflows/frontend-fix.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gmd-frontend-fix
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Reassemble and verify fix bundle
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/frontend-fix/bundle.b64.part-* > /tmp/gmd-frontend-fix.b64
          test "$(wc -c < /tmp/gmd-frontend-fix.b64 | tr -d ' ')" = "24716"
          echo "049e60edb6d22ac50497de93629b2cee8027c20adacdf9a27fa7bd5063c495f7  /tmp/gmd-frontend-fix.b64" | sha256sum --check --strict
          base64 --decode /tmp/gmd-frontend-fix.b64 > /tmp/gmd-frontend-fix.tar.xz
          test "$(wc -c < /tmp/gmd-frontend-fix.tar.xz | tr -d ' ')" = "18536"
          echo "3ada3aad06e93e286c902b46f8b8e74597ca84498f9d6fe684f2cbbc2d3cb19b  /tmp/gmd-frontend-fix.tar.xz" | sha256sum --check --strict

      - name: Apply website and visibility-gate files
        run: tar -xJf /tmp/gmd-frontend-fix.tar.xz -C .

      - name: Validate publication and frontend visibility
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_publish.py --root .
          python3 scripts/validate_frontend.py --root .
          node --check docs/assets/app.js

      - name: Commit production fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/assets/app.js docs/assets/styles.css scripts/validate_frontend.py
          if git diff --cached --quiet; then
            echo "No frontend changes to commit."
            exit 0
          fi
          git commit -m "fix(site): restore readable continuous market report"
          git push origin HEAD:main
