name: Promote v2.1 Product Files to Clean Release Branch R2

on:
  push:
    branches: [work/fix-schedules-copy-audit]
    paths:
      - ".github/workflows/promote-v21-product-r2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --quiet "jsonschema>=4.23,<5"
      - name: Sync and copy validated product files
        shell: bash
        run: |
          set -euo pipefail
          sleep 15
          git fetch origin work/fix-schedules-copy-audit release/v2.1-production
          git checkout -B release/v2.1-production origin/release/v2.1-production
          git checkout origin/work/fix-schedules-copy-audit -- docs scripts prompts
          test -f docs/data/automation/v21-validation.json
          grep -q 'verified_release_candidate' docs/data/automation/v21-validation.json
          grep -q '"site_version": "2.1.0"' docs/version.json
          grep -q 'DEXCHUS' scripts/build_market_lens.py
          test -f scripts/generate_daily_with_openai.py
          test -f prompts/global-market-daily-master.md
      - name: Validate clean product tree
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_publish.py --root .
          python scripts/validate_frontend.py --root .
          python scripts/validate_market_lens.py
          python scripts/validate_v21_contract.py
          python -m py_compile scripts/build_market_lens.py scripts/generate_daily_with_openai.py scripts/validate_v21_contract.py
          node --check docs/assets/app.js
          node --check docs/assets/p0.js
          node --check docs/assets/trends.js
      - name: Commit clean product release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs scripts prompts
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "fix(site): prepare v2.1 trend, policy and automation release"
          git push origin HEAD:release/v2.1-production
