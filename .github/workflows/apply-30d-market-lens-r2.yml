name: Recover and Finalize 30D Market Lens v2

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-30d-market-lens-r2.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-30d-market-lens-v2
  cancel-in-progress: false

jobs:
  recover-build-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout current main
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect already-complete production state
        id: state
        shell: bash
        run: |
          set -euo pipefail
          complete=false
          if [[ -f docs/version.json ]] \
             && python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('docs/version.json')
          raise SystemExit(0 if json.loads(p.read_text()).get('site_version') == '2.0.0' else 1)
          PY
          then
            complete=true
          fi
          echo "complete=$complete" >> "$GITHUB_OUTPUT"
          if [[ "$complete" == false && ! -d bootstrap/lens-v2 ]]; then
            echo "Neither a complete v2 release nor the v2 source bundle exists." >&2
            exit 1
          fi

      - name: Prepare corrected source bundle
        if: steps.state.outputs.complete != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('bootstrap/lens-v2/build_market_lens.py')
          text = path.read_text(encoding='utf-8')
          pattern = re.compile(
              r'(?P<indent>\s*)reader = csv\.DictReader\(body\.splitlines\(\)\)\n'
              r'(?P=indent)value_column = next\(\(name for name in \(reader\.fieldnames or \[\]\) if name != "DATE"\), None\)\n'
              r'(?P=indent)if not value_column:\n'
              r'(?P=indent)    raise ValueError\(f"FRED response for \{series_id\} has no value column"\)\n'
              r'(?P=indent)for row in reader:\n'
              r'(?P=indent)    value = parse_number\(row\.get\(value_column\)\)\n'
              r'(?P=indent)    if value is not None:\n'
              r'(?P=indent)        rows\[row\["DATE"\]\] = value'
          )
          match = pattern.search(text)
          if not match:
              if 'date_column = next(' not in text:
                  raise RuntimeError('Could not locate FRED CSV parser')
          else:
              indent = match.group('indent')
              replacement = (
                  f'{indent}reader = csv.DictReader(body.splitlines())\n'
                  f'{indent}fieldnames = reader.fieldnames or []\n'
                  f'{indent}date_column = next((name for name in fieldnames if name.lower() in {{"date", "observation_date"}}), fieldnames[0] if fieldnames else None)\n'
                  f'{indent}value_column = next((name for name in fieldnames if name != date_column), None)\n'
                  f'{indent}if not date_column or not value_column:\n'
                  f'{indent}    raise ValueError(f"FRED response for {{series_id}} has no date/value columns")\n'
                  f'{indent}for row in reader:\n'
                  f'{indent}    value = parse_number(row.get(value_column))\n'
                  f'{indent}    if value is not None and row.get(date_column):\n'
                  f'{indent}        rows[row[date_column]] = value'
              )
              text = text[:match.start()] + replacement + text[match.end():]
          path.write_text(text, encoding='utf-8')

          # Preserve the legacy shell's own cache/version contract. v2 is recorded
          # in version.json and in the new assets, so the old app need not change its
          # data-site-version attribute.
          path = Path('bootstrap/lens-v2/migrate_existing.py')
          text = path.read_text(encoding='utf-8')
          text = re.sub(
              r'\n\s*text = re\.sub\(r\'<html lang="zh-CN".*?count=1\)',
              '',
              text,
              count=1,
              flags=re.S,
          )
          path.write_text(text, encoding='utf-8')
          PY
          python3 -m py_compile bootstrap/lens-v2/build_market_lens.py bootstrap/lens-v2/migrate_existing.py bootstrap/lens-v2/validate_market_lens.py

      - name: Install source and UI files
        if: steps.state.outputs.complete != 'true'
        shell: bash
        run: |
          set -euo pipefail
          install -D -m 0755 bootstrap/lens-v2/build_market_lens.py scripts/build_market_lens.py
          install -D -m 0755 bootstrap/lens-v2/validate_market_lens.py scripts/validate_market_lens.py
          install -D -m 0755 bootstrap/lens-v2/browser_smoke.sh scripts/browser_smoke.sh
          install -D -m 0644 bootstrap/lens-v2/trends.html docs/trends.html
          install -D -m 0644 bootstrap/lens-v2/trends.js docs/assets/trends.js
          install -D -m 0644 bootstrap/lens-v2/p0.js docs/assets/p0.js
          install -D -m 0644 bootstrap/lens-v2/market-lens.css docs/assets/market-lens.css
          install -D -m 0644 bootstrap/lens-v2/theme-registry.json docs/data/trends/theme-registry.json
          install -D -m 0644 bootstrap/lens-v2/market-lens.schema.json schemas/market-lens.schema.json
          install -D -m 0644 bootstrap/lens-v2/30d-market-lens.md docs/product/30d-market-lens.md

      - name: Integrate with existing daily site
        if: steps.state.outputs.complete != 'true'
        run: python3 bootstrap/lens-v2/migrate_existing.py

      - name: Add rendered QA hooks and cross-section event styling
        if: steps.state.outputs.complete != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def insert_once(path_name: str, old: str, new: str) -> None:
              path = Path(path_name)
              text = path.read_text(encoding='utf-8')
              if new in text:
                  return
              if old not in text:
                  raise RuntimeError(f'QA hook target not found in {path_name}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          insert_once(
              'docs/assets/trends.js',
              '    document.body.dataset.lensReady = "true";',
              '''    document.body.dataset.lensReady = "true";
              requestAnimationFrame(() => {
                document.body.dataset.horizontalOverflow = String(document.documentElement.scrollWidth > window.innerWidth + 1);
                if (new URLSearchParams(window.location.search).get("qa") === "1") {
                  const point = document.querySelector(".catalyst-point");
                  if (point) point.dispatchEvent(new MouseEvent("click", { bubbles: true }));
                  document.body.dataset.catalystQa = point && document.querySelector("#catalyst-detail h3") ? "passed" : "failed";
                }
              });'''
          )
          insert_once(
              'docs/assets/p0.js',
              '  document.body.dataset.p0Ready = "true";',
              '''  document.body.dataset.p0Ready = "true";
            requestAnimationFrame(() => {
              document.body.dataset.horizontalOverflow = String(document.documentElement.scrollWidth > window.innerWidth + 1);
              if (new URLSearchParams(window.location.search).get("qa") === "1") {
                const button = document.querySelectorAll(".section-jump__button")[3];
                const pathBefore = window.location.pathname;
                if (button) button.click();
                document.body.dataset.navigationQa = button && window.location.pathname === pathBefore ? "passed" : "failed";
              }
            });'''
          )

          path = Path('scripts/browser_smoke.sh')
          text = path.read_text(encoding='utf-8')
          if 'data-horizontal-overflow="false"' not in text:
              text = text.replace(
                  "  grep -q 'id=\"reading-dock\"' \"$TMP/${file}.html\"",
                  "  grep -q 'id=\"reading-dock\"' \"$TMP/${file}.html\"\n  grep -q 'data-horizontal-overflow=\"false\"' \"$TMP/${file}.html\"\n  grep -q 'data-navigation-qa=\"passed\"' \"$TMP/${file}.html\"",
              )
              text = text.replace(
                  "  grep -q 'class=\"asset-chart' \"$TMP/${file}.html\"",
                  "  grep -q 'class=\"asset-chart' \"$TMP/${file}.html\"\n  grep -q 'data-horizontal-overflow=\"false\"' \"$TMP/${file}.html\"\n  grep -q 'data-catalyst-qa=\"passed\"' \"$TMP/${file}.html\"",
              )
              path.write_text(text, encoding='utf-8')
          PY

          if ! grep -q 'Structured cross-section event collections retained from v1.3' docs/assets/market-lens.css; then
            cat >> docs/assets/market-lens.css <<'CSS'

          /* Structured cross-section event collections retained from v1.3. */
          .structured-event-collection { margin-top: 28px; }
          .structured-event-group { margin-top: 26px; border-top: 1px solid var(--lens-ink); }
          .structured-event-group__header { display: flex; justify-content: space-between; gap: 18px; align-items: baseline; padding: 10px 0; }
          .structured-event-group__header h4 { margin: 0; font-family: var(--serif, Georgia, serif); font-size: 1.08rem; text-transform: none; letter-spacing: 0; }
          .structured-event-group__header span { color: var(--lens-muted); font-family: var(--mono, monospace); font-size: .68rem; }
          .structured-event { padding: 20px 0 24px; border-top: 1px solid var(--lens-hairline); }
          .structured-event__header { display: flex; justify-content: space-between; gap: 24px; align-items: flex-start; }
          .structured-event__eyebrow { color: var(--lens-accent); font-size: .69rem; font-weight: 800; letter-spacing: .055em; }
          .structured-event h5 { margin: 5px 0 0; font-family: var(--serif, Georgia, serif); font-size: 1.12rem; line-height: 1.35; }
          .structured-event__meta { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
          .structured-event__chip { padding: 3px 6px; border: 1px solid var(--lens-hairline); color: var(--lens-charcoal); font-size: .68rem; }
          .structured-event__time { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); margin-top: 13px; border-top: 1px solid var(--lens-hairline); border-left: 1px solid var(--lens-hairline); }
          .structured-event__time-item { padding: 9px; border-right: 1px solid var(--lens-hairline); border-bottom: 1px solid var(--lens-hairline); }
          .structured-event__time-item__label,
          .structured-event__fact__label,
          .structured-event__transmission__label,
          .structured-event__assets-label { color: var(--lens-accent); font-size: .69rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; }
          .structured-event__time-item__value,
          .structured-event__fact__value,
          .structured-event__transmission__value { margin: 5px 0 0; color: var(--lens-charcoal); font-size: .86rem; line-height: 1.58; }
          .structured-event__fact { padding: 12px 0; border-bottom: 1px solid var(--lens-hairline); }
          .structured-event__transmission { margin: 14px 0; padding: 13px 15px; border-left: 4px solid var(--lens-accent); background: var(--lens-paper-deep); }
          .structured-event__assets { padding: 4px 0 14px; }
          .structured-event__assets-list { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
          .structured-event__empty { padding: 13px 0; color: var(--lens-muted); font-style: italic; }
          @media (max-width: 900px) {
            .structured-event__header { display: block; }
            .structured-event__meta { justify-content: flex-start; margin-top: 10px; }
            .structured-event__time { grid-template-columns: 1fr; }
          }
          CSS
          fi

      - name: Write permanent workflows
        if: steps.state.outputs.complete != 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/workflows/quality.yml <<'YAML'
          name: Publication Quality Gate
          on:
            push:
              branches: [main]
            pull_request:
            workflow_dispatch:
          permissions:
            contents: read
          jobs:
            validate:
              name: Validate publication, Market Lens and rendered UX
              runs-on: ubuntu-latest
              timeout-minutes: 12
              steps:
                - uses: actions/checkout@v7
                - uses: actions/setup-python@v7
                  with:
                    python-version: "3.12"
                - run: python scripts/build_market_lens.py --root .
                - run: |
                    python scripts/validate_publish.py --root .
                    python scripts/validate_frontend.py --root .
                    python scripts/validate_market_lens.py --root .
                    node --check docs/assets/app.js
                    node --check docs/assets/p0.js
                    node --check docs/assets/trends.js
                    python -m json.tool docs/data/trends/market-history.json >/dev/null
                    python -m json.tool docs/data/trends/rolling-30d.json >/dev/null
                    git diff --check
                - run: bash scripts/browser_smoke.sh .
          YAML

          cat > .github/workflows/pages.yml <<'YAML'
          name: Deploy Global Market Daily
          on:
            push:
              branches: [main]
              paths:
                - "docs/**"
                - "scripts/**"
                - "schemas/**"
                - ".github/workflows/pages.yml"
            workflow_dispatch:
          permissions:
            contents: read
            pages: write
            id-token: write
          concurrency:
            group: pages
            cancel-in-progress: false
          jobs:
            validate:
              name: Build and validate publication bundle
              runs-on: ubuntu-latest
              timeout-minutes: 15
              steps:
                - uses: actions/checkout@v7
                - uses: actions/setup-python@v7
                  with:
                    python-version: "3.12"
                - run: python scripts/build_market_lens.py --root . --network
                - run: |
                    python scripts/validate_publish.py --root .
                    python scripts/validate_frontend.py --root .
                    python scripts/validate_market_lens.py --root .
                    node --check docs/assets/app.js
                    node --check docs/assets/p0.js
                    node --check docs/assets/trends.js
                - run: bash scripts/browser_smoke.sh .
                - uses: actions/upload-pages-artifact@v5
                  with:
                    path: ./docs
            deploy:
              name: Deploy GitHub Pages
              needs: validate
              environment:
                name: github-pages
                url: ${{ steps.deployment.outputs.page_url }}
              runs-on: ubuntu-latest
              timeout-minutes: 10
              steps:
                - uses: actions/configure-pages@v6
                - id: deployment
                  uses: actions/deploy-pages@v5
          YAML

          cat > .github/workflows/trends-refresh.yml <<'YAML'
          name: Refresh 30D Market Lens Data
          on:
            push:
              branches: [main]
              paths:
                - "docs/data/daily/**"
                - "docs/data/latest.json"
            schedule:
              - cron: "30 4 * * 1-6"
            workflow_dispatch:
          permissions:
            contents: write
          concurrency:
            group: trends-refresh
            cancel-in-progress: false
          jobs:
            refresh:
              runs-on: ubuntu-latest
              timeout-minutes: 12
              steps:
                - uses: actions/checkout@v7
                  with:
                    fetch-depth: 0
                - uses: actions/setup-python@v7
                  with:
                    python-version: "3.12"
                - run: python scripts/build_market_lens.py --root . --network
                - run: python scripts/validate_market_lens.py --root .
                - shell: bash
                  run: |
                    set -euo pipefail
                    git config user.name "github-actions[bot]"
                    git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                    git add docs/data/trends/market-history.json docs/data/trends/rolling-30d.json
                    if git diff --cached --quiet; then exit 0; fi
                    git commit -m "data: refresh 30-day market lens"
                    git pull --rebase origin main
                    git push origin HEAD:main
          YAML

      - name: Build maximum useful source history and rolling snapshot
        if: steps.state.outputs.complete != 'true'
        run: python3 scripts/build_market_lens.py --root . --network

      - name: Run all deterministic and browser gates
        if: steps.state.outputs.complete != 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_publish.py --root .
          python3 scripts/validate_frontend.py --root .
          python3 scripts/validate_market_lens.py --root .
          node --check docs/assets/app.js
          node --check docs/assets/p0.js
          node --check docs/assets/trends.js
          python3 -m json.tool docs/data/trends/market-history.json >/dev/null
          python3 -m json.tool docs/data/trends/rolling-30d.json >/dev/null
          python3 -m json.tool schemas/market-lens.schema.json >/dev/null
          git diff --check
          bash scripts/browser_smoke.sh .

      - name: Clean temporary source and migration workflows
        shell: bash
        run: |
          set -euo pipefail
          find .github/workflows -maxdepth 1 -type f \
            ! -name 'pages.yml' \
            ! -name 'quality.yml' \
            ! -name 'trends-refresh.yml' \
            ! -name 'apply-30d-market-lens-r2.yml' \
            -delete
          rm -f .github/workflows/apply-30d-market-lens-r2.yml
          rm -rf bootstrap

      - name: Commit clean production state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Production state already clean and complete."
            exit 0
          fi
          git commit -m "feat(site): launch 30-day market lens and P0 intelligence"
          git pull --rebase origin main
          git push origin HEAD:main
