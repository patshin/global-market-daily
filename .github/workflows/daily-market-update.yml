name: Publish Global Market Daily — 09:00 / 18:00 SGT

on:
  schedule:
    # Singapore has no DST: 09:00 SGT = 01:00 UTC; 18:00 SGT = 10:00 UTC.
    - cron: "0 1 * * *"
    - cron: "0 10 * * *"
  workflow_dispatch:
    inputs:
      edition:
        description: Publication cycle
        required: true
        type: choice
        options: [morning, close]
      date:
        description: Optional SGT date override (YYYY-MM-DD)
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - ".github/workflows/daily-market-update.yml"
      - "scripts/generate_daily_update.py"
      - "prompts/global-market-daily-master.md"

permissions:
  contents: write

concurrency:
  group: global-market-daily-publication
  cancel-in-progress: false

env:
  OPENAI_MODEL: gpt-5.6-sol
  OPENAI_REASONING_EFFORT: xhigh

jobs:
  validate-automation:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Static validation
        run: |
          python -m py_compile scripts/generate_daily_update.py scripts/build_market_lens.py
          python - <<'PY'
          from pathlib import Path
          w=Path('.github/workflows/daily-market-update.yml').read_text()
          assert '0 1 * * *' in w and '0 10 * * *' in w
          assert 'gpt-5.6-sol' in w and 'xhigh' in w
          p=Path('prompts/global-market-daily-master.md').read_text()
          for item in ['Fifteen core sections','morning','close','Top 3 Catalysts']:
              assert item in p
          print('TWICE-DAILY AUTOMATION STATIC GATE PASSED')
          PY

  publish:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_PROJECT_ID: ${{ secrets.OPENAI_PROJECT_ID }}
      OPENAI_ORG_ID: ${{ secrets.OPENAI_ORG_ID }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Resolve publication cycle
        id: cycle
        shell: bash
        env:
          MANUAL_EDITION: ${{ inputs.edition }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            edition="$MANUAL_EDITION"
          elif [ "${{ github.event.schedule }}" = "0 1 * * *" ]; then
            edition="morning"
          else
            edition="close"
          fi
          echo "edition=$edition" >> "$GITHUB_OUTPUT"

      - name: Preflight credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::error::OPENAI_API_KEY repository secret is missing. The schedule exists, but research publication cannot run until this secret is configured."
            exit 1
          fi

      - name: Generate full source-backed edition
        shell: bash
        env:
          TARGET_DATE: ${{ inputs.date }}
        run: |
          set -euo pipefail
          args=(--edition "${{ steps.cycle.outputs.edition }}")
          if [ -n "${TARGET_DATE:-}" ]; then args+=(--date "$TARGET_DATE"); fi
          python scripts/generate_daily_update.py "${args[@]}"

      - name: Rebuild 30D market memory
        run: python scripts/build_market_lens.py

      - name: Run all publication gates
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_publish.py --root .
          python scripts/validate_frontend.py --root .
          python scripts/validate_market_lens.py
          node --check docs/assets/app.js
          node --check docs/assets/p0.js
          node --check docs/assets/trends.js
          git diff --check

      - name: Commit and publish atomically
        shell: bash
        run: |
          set -euo pipefail
          edition="${{ steps.cycle.outputs.edition }}"
          report_date="$(python -c 'import json; print(json.load(open("docs/data/latest.json"))["date"])')"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data docs/reports docs/version.json
          if git diff --cached --quiet; then
            echo "No publication changes detected."
            exit 0
          fi
          if [ "$edition" = "morning" ]; then
            message="daily: publish morning market brief $report_date"
          else
            message="daily: publish closing market brief $report_date"
          fi
          git commit -m "$message"
          git pull --rebase origin main
          git push origin HEAD:main
