name: Apply recovered 2026-09-03 official edition

on:
  push:
    branches: [manual/2026-09-03-evening-r2]
    paths:
      - ".github/workflows/apply-manual-0903.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout recovery branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Reassemble and verify recovered edition
        shell: bash
        run: |
          set -euo pipefail
          cat .release/manual-0903/part-* > /tmp/manual0903.b64
          test "$(wc -c < /tmp/manual0903.b64 | tr -d ' ')" = "33088"
          base64 --decode /tmp/manual0903.b64 > /tmp/manual0903.tar.gz
          echo "df7f1e1b0043294c9298f46f24d901ebe19d58952741e7c1b59eb1bb6ec6a325  /tmp/manual0903.tar.gz" | sha256sum --check --strict
          tar -tzf /tmp/manual0903.tar.gz
          tar -xzf /tmp/manual0903.tar.gz -C .

      - name: Strengthen thin content caught by the release gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          jp=Path('docs/data/daily/2026-09-03.json')
          report=json.loads(jp.read_text())
          old_inv=report['top_catalysts'][1]['invalidation']
          new_inv='后续AI收入、订单、毛利率或客户容量承诺连续低于当前高增长路径，并导致未来两个季度的收入指引同步下修。'
          report['top_catalysts'][1]['invalidation']=new_inv
          old_etf='相关ETF表现主要仍由底层资产与折现率驱动。'
          new_etf='相关ETF表现主要仍由底层资产与折现率驱动；截至截点没有一手证据支持将常规资金流升级为独立市场催化剂。'
          report['sections']['etf']['paragraphs']=[new_etf]
          jp.write_text(json.dumps(report, ensure_ascii=False, indent=2)+'\n')
          mp=Path('docs/reports/2026/09/2026-09-03.md')
          md=mp.read_text()
          md=md.replace(old_inv,new_inv).replace(old_etf,new_etf)
          mp.write_text(md)
          PY

      - name: Protect current provisional latest
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          latest=json.loads(Path('docs/data/latest.json').read_text())
          assert latest['date']=='2026-09-04', latest
          assert latest.get('edition_status')=='provisional', latest
          report=json.loads(Path('docs/data/daily/2026-09-04.json').read_text())
          assert report['publication_cycle']['is_final'] is False
          assert report['publication_cycle']['archive_eligible'] is False
          recovered=json.loads(Path('docs/data/daily/2026-09-03.json').read_text())
          assert recovered['publication_cycle']['is_final'] is True
          assert recovered['publication_cycle']['archive_eligible'] is True
          print('LATEST/ARCHIVE CONCURRENCY CONTRACT PASSED')
          PY

      - name: Rebuild 30D market lens
        run: python3 scripts/build_market_lens.py

      - name: Run production release gates
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_publish_v2.py --root .
          python3 scripts/validate_frontend.py --root .
          python3 scripts/validate_market_lens.py
          node --check docs/assets/app.js
          node --check docs/assets/p0.js
          node --check docs/assets/trends.js
          python3 - <<'PY'
          import json
          from pathlib import Path
          archive=json.loads(Path('docs/data/archive.json').read_text())
          assert [x['date'] for x in archive['entries']][:2] == ['2026-09-03','2026-09-02']
          latest=json.loads(Path('docs/data/latest.json').read_text())
          assert latest['date']=='2026-09-04' and latest.get('edition_status')=='provisional'
          lens=json.loads(Path('docs/data/trends/rolling-30d.json').read_text())
          days={d['date']:d for d in lens.get('days',[])}
          assert days.get('2026-09-03',{}).get('source_mode')=='native_daily', days.get('2026-09-03')
          assert days.get('2026-09-04',{}).get('source_mode')!='native_daily', days.get('2026-09-04')
          cats=days['2026-09-03'].get('catalysts',[])
          assert any(c.get('category')=='china_trade_policy' for c in cats), cats
          print('RECOVERY INVARIANTS PASSED')
          PY

      - name: Commit verified product files only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/daily/2026-09-03.json docs/data/sources/2026-09-03.json docs/reports/2026/09/2026-09-03.md docs/data/archive.json docs/data/trends/market-history.json docs/data/trends/rolling-30d.json docs/data/trends/theme-registry.json
          git reset .release .github/workflows/apply-manual-0903.yml 2>/dev/null || true
          git commit -m "daily: recover official market brief 2026-09-03"
          git push origin HEAD:manual/2026-09-03-evening-r2
