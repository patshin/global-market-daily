name: Publication Quality Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate publication, trend lens and automation contract
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check --quiet "jsonschema>=4.23,<5"

      - name: Run deterministic publication gates
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_publish.py --root .
          python scripts/validate_frontend.py --root .
          python scripts/validate_market_lens.py
          python scripts/validate_v21_contract.py
          if [[ -f scripts/test_market_lens_native_accumulation.py ]]; then
            python scripts/test_market_lens_native_accumulation.py
          fi

      - name: Check Python and JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            scripts/build_market_lens.py \
            scripts/generate_daily_with_openai.py \
            scripts/validate_market_lens.py \
            scripts/validate_v21_contract.py
          node --check docs/assets/app.js
          node --check docs/assets/p0.js
          node --check docs/assets/trends.js
          python scripts/generate_daily_with_openai.py --help >/dev/null
