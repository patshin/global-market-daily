name: Publication Quality Gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate publication, automation, editorial UI and JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run deterministic publication gate
        run: python scripts/validate_publish_v2.py --root .
      - name: Validate historical reconstruction provenance
        run: python scripts/validate_reconstruction.py
      - name: Enforce live renderer contract
        run: python scripts/validate_live_contract.py --root .
      - name: Enforce formal archive renderer contracts
        run: python scripts/validate_archive_live_contract.py --root .
      - name: Enforce standalone morning and close automation prompts
        run: python scripts/validate_automation_contract.py .
      - name: Enforce editorial signal and watch-first UI contract
        run: python scripts/validate_editorial_ui.py .
      - name: Run frontend visibility gate
        run: python scripts/validate_frontend.py --root .
      - name: Run 30D market lens gate
        run: python scripts/validate_market_lens.py
      - name: Test market lens accumulation and partial releases
        run: python scripts/test_market_lens_native_accumulation.py
      - name: Test stale and duplicate publication protection
        run: |
          python scripts/test_publication_transition.py
          python scripts/test_publication_watchdog.py
          python scripts/test_reconstruction.py
      - name: Enforce content-addressed asset cache URLs
        run: python scripts/stamp_assets.py --check
      - name: Check JavaScript syntax
        run: |
          node --check docs/assets/app.js
          node --check docs/assets/publication-compat.js
          node --check docs/assets/editorial-v2.js
          node --check docs/assets/p0.js
          node --check docs/assets/trends.js


      - name: Render candidate desktop and mobile in real Chromium
        run: python scripts/verify_candidate_browser.py
      - name: Preserve candidate browser DOM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-browser-dom
          path: /tmp/gmd-browser-artifacts
          if-no-files-found: ignore
