name: Public Site Health Check

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/site-health.yml"
  workflow_run:
    workflows: ["Deploy Global Market Daily"]
    types: [completed]
  schedule:
    - cron: "0 0 * * 1-6"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-site-health
  cancel-in-progress: true

jobs:
  verify-public-pages:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify deployed public publication bundle
        shell: bash
        run: |
          set -euo pipefail
          base="https://patshin.github.io/global-market-daily"
          for attempt in $(seq 1 24); do
            echo "Public verification attempt ${attempt}/24"
            ok=1
            curl -fsSL --max-time 20 "$base/" -o /tmp/index.html || ok=0
            curl -fsSL --max-time 20 "$base/trends.html" -o /tmp/trends.html || ok=0
            curl -fsSL --max-time 20 "$base/data/latest.json" -o /tmp/latest.json || ok=0
            curl -fsSL --max-time 20 "$base/data/archive.json" -o /tmp/archive.json || ok=0
            curl -fsSL --max-time 20 "$base/data/trends/rolling-30d.json" -o /tmp/rolling.json || ok=0
            if [ "$ok" = 1 ] && grep -q '30D Market Lens' /tmp/index.html; then
              if python3 - <<'PY'
          import json, pathlib, subprocess
          base='https://patshin.github.io/global-market-daily'
          latest=json.load(open('/tmp/latest.json'))
          archive=json.load(open('/tmp/archive.json'))
          rolling=json.load(open('/tmp/rolling.json'))
          date=latest.get('date')
          assert isinstance(date,str) and len(date)==10
          for field in ('daily_json_path','report_path','sources_path'):
              assert latest.get(field), field
          paths={
              'daily': latest['daily_json_path'],
              'report': latest['report_path'],
              'sources': latest['sources_path'],
          }
          for key,path in paths.items():
              out=f'/tmp/{key}.live'
              subprocess.run(['curl','-fsSL','--max-time','20',f'{base}/{path}','-o',out],check=True)
          daily=json.load(open('/tmp/daily.live'))
          sources=json.load(open('/tmp/sources.live'))
          assert daily['date']==date
          assert sources['date']==date
          assert daily['thesis']==latest['thesis']
          assert daily['dominant_narrative']==latest['dominant_narrative']
          assert len(daily.get('top_catalysts',[]))==3
          assert len(daily.get('section_order',[]))==15
          assert len(daily.get('sections',{}))==15
          assert len(daily.get('top_risks',[]))==3
          assert daily.get('sources_path')==latest['sources_path']
          assert set(daily.get('sources',[]))=={s.get('id') for s in sources.get('sources',[])}
          archive_dates={x.get('date') for x in archive.get('entries',[])}
          cycle=daily.get('publication_cycle') or {}
          if cycle.get('is_final') is False:
              assert latest.get('edition_status')=='provisional'
              assert cycle.get('archive_eligible') is False
              assert cycle.get('market_lens_native_eligible') is False
              assert date not in archive_dates
              native_dates={d.get('date') for d in rolling.get('days',[]) if d.get('source_mode')=='native_daily'}
              assert date not in native_dates
          else:
              assert date in archive_dates
          assert pathlib.Path('/tmp/report.live').stat().st_size > 2000
          print(f'PUBLIC BUNDLE VERIFIED: latest={date}, status={latest.get("edition_status","official")}, daily/report/sources consistent, archive isolation OK')
          PY
              then
                exit 0
              fi
            fi
            sleep 5
          done
          echo "Public site never converged to a self-consistent publication bundle"
          exit 1

      - name: Verify browser renders latest edition
        shell: bash
        run: |
          set -euo pipefail
          base="https://patshin.github.io/global-market-daily"
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$browser" ]; then
            echo "No Chromium-compatible browser is available on the runner. Browser-level verification is mandatory."
            exit 1
          fi

          latest_date="$(python3 - <<'PY'
          import json
          print(json.load(open('/tmp/latest.json'))['date'])
          PY
          )"
          expected_thesis="$(python3 - <<'PY'
          import json
          print(json.load(open('/tmp/latest.json'))['thesis'])
          PY
          )"

          for attempt in $(seq 1 3); do
            echo "Browser render attempt ${attempt}/3 for ${latest_date}"
            "$browser" \
              --headless=new \
              --disable-gpu \
              --no-sandbox \
              --disable-dev-shm-usage \
              --virtual-time-budget=15000 \
              --enable-logging=stderr \
              --dump-dom "$base/" > /tmp/rendered.html 2>/tmp/browser.stderr || true

            if LATEST_DATE="$latest_date" EXPECTED_THESIS="$expected_thesis" python3 - <<'PY'
          import os
          from html.parser import HTMLParser

          VOID = {'area','base','br','col','embed','hr','img','input','link','meta','param','source','track','wbr'}

          class Capture(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.stack=[]
                  self.nodes={}
              def handle_starttag(self, tag, attrs):
                  attrs=dict(attrs)
                  node_id=attrs.get('id')
                  if node_id:
                      self.nodes[node_id]={'attrs':attrs,'text':[]}
                  if tag not in VOID:
                      self.stack.append((tag,node_id))
              def handle_startendtag(self, tag, attrs):
                  attrs=dict(attrs)
                  node_id=attrs.get('id')
                  if node_id:
                      self.nodes[node_id]={'attrs':attrs,'text':[]}
              def handle_endtag(self, tag):
                  for i in range(len(self.stack)-1,-1,-1):
                      if self.stack[i][0] == tag:
                          del self.stack[i:]
                          return
              def handle_data(self, data):
                  for _,node_id in reversed(self.stack):
                      if node_id and node_id in self.nodes:
                          self.nodes[node_id]['text'].append(data)
                          return

          parser=Capture()
          parser.feed(open('/tmp/rendered.html', encoding='utf-8').read())
          nodes=parser.nodes
          date=os.environ['LATEST_DATE']
          expected=os.environ['EXPECTED_THESIS'].strip()

          def node_text(node_id):
              node=nodes.get(node_id)
              return ' '.join(node['text']).strip() if node else ''

          shell=nodes.get('report-shell')
          error=nodes.get('error-state')
          loading=nodes.get('loading-state')
          title=nodes.get('edition-title')
          thesis=nodes.get('thesis')
          print('BROWSER DIAGNOSTICS:')
          print('  report-shell attrs =', shell['attrs'] if shell else None)
          print('  loading-state attrs =', loading['attrs'] if loading else None)
          print('  error-state attrs =', error['attrs'] if error else None)
          print('  error-message =', repr(node_text('error-message')))
          print('  edition-title =', repr(node_text('edition-title')))
          print('  thesis =', repr(node_text('thesis')))

          assert shell is not None, 'report-shell missing'
          assert 'hidden' not in shell['attrs'], f'report-shell hidden; page error={node_text("error-message")!r}'
          assert error is not None and 'hidden' in error['attrs'], f'error-state visible; page error={node_text("error-message")!r}'
          rendered_title=node_text('edition-title')
          rendered_thesis=node_text('thesis')
          assert date in rendered_title, f'latest date not rendered: {rendered_title!r}'
          assert rendered_thesis == expected, 'rendered thesis does not match latest.json'
          print(f'BROWSER RENDER VERIFIED: {date} is visible and Publication Error is hidden')
          PY
            then
              exit 0
            fi
            tail -n 80 /tmp/browser.stderr || true
            sleep 3
          done

          echo "Browser could fetch the site but never rendered the latest edition successfully."
          exit 1
