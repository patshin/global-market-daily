name: Public Site Health Check

on:
  workflow_run:
    workflows: ["Deploy Global Market Daily"]
    types: [completed]
  schedule:
    - cron: "20 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-site-health
  cancel-in-progress: true

jobs:
  verify-public-pages:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Wait for Pages edge propagation
        run: sleep 15

      - name: Fetch public production resources
        shell: bash
        run: |
          set -euo pipefail
          base="https://patshin.github.io/global-market-daily"
          declare -A resources=(
            [index]="/"
            [trends]="/trends.html"
            [version]="/version.json"
            [rolling]="/data/trends/rolling-30d.json"
            [schedule]="/data/automation/schedule.json"
          )
          for name in "${!resources[@]}"; do
            curl --fail --silent --show-error --location \
              --retry 8 --retry-delay 5 --retry-all-errors \
              "$base${resources[$name]}?health_run=${GITHUB_RUN_ID}" \
              -o "$name.out"
          done

      - name: Validate public responses
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'assets/p0.js?v=2.1.0' index.out
          grep -q '点内数字为当日优先级' trends.out
          ! grep -q '离散状态，不使用黑箱综合分数' trends.out
          ! grep -q '价格共振仅作为 Narrative' trends.out
          python3 - <<'PY'
          import json
          from pathlib import Path
          version=json.loads(Path('version.out').read_text())
          rolling=json.loads(Path('rolling.out').read_text())
          schedule=json.loads(Path('schedule.out').read_text())
          assert version['site_version']=='2.1.0'
          assert 'DEXCHUS' in rolling['series']
          assert rolling['category_activity']['china_trade_policy']['status'] in {'active','not_in_top3'}
          assert len(schedule['runs'])==2
          assert {(r['local_time'],r['edition']) for r in schedule['runs']}=={('09:00','morning'),('18:00','eod')}
          print('PUBLIC SITE HEALTH PASSED — v2.1')
          PY
