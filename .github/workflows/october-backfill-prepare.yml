name: October Backfill Audit Snapshot
on:
  push:
    branches: [fix/gmd-october-backfill-lens]
    paths: [.github/workflows/october-backfill-prepare.yml]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Retrieve Treasury public historical yield table
        run: |
          python - <<'PY'
          import pathlib,json,concurrent.futures
          from urllib.request import Request,urlopen
          from datetime import datetime,timezone
          out=pathlib.Path('/tmp/gmd-treasury-source');out.mkdir()
          urls={'treasury.html':'https://home.treasury.gov/resource-center/data-chart-center/interest-rates/TextView?field_tdr_date_value=2026&type=daily_treasury_yield_curve','treasury.xml':'https://home.treasury.gov/resource-center/data-chart-center/interest-rates/pages/xml?data=daily_treasury_yield_curve&field_tdr_date_value=2026','DGS5.csv':'https://fred.stlouisfed.org/graph/fredgraph.csv?id=DGS5','DGS30.csv':'https://fred.stlouisfed.org/graph/fredgraph.csv?id=DGS30'}
          def get(item):
              name,url=item;r={'file':name,'source_url':url,'retrieved_at':datetime.now(timezone.utc).isoformat()}
              try:
                  with urlopen(Request(url,headers={'User-Agent':'Mozilla/5.0 GlobalMarketDailyHistoricalAudit'}),timeout=25) as response:payload=response.read();r.update(status=response.status,bytes=len(payload))
                  if len(payload)>5000000:raise ValueError('Unexpected payload size')
                  (out/name).write_bytes(payload)
              except Exception as exc:r['error']=str(exc)
              return r
          with concurrent.futures.ThreadPoolExecutor(max_workers=4) as pool:manifest=list(pool.map(get,urls.items()))
          (out/'manifest.json').write_text(json.dumps(manifest,indent=2)+'\n');print(json.dumps(manifest,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: october-treasury-primary
          path: /tmp/gmd-treasury-source
          retention-days: 2
          if-no-files-found: error
