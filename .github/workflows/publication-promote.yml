name: Promote Validated GMD Publication

on:
  workflow_run:
    workflows: ["Publication Quality Gate"]
    types: [completed]

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: gmd-publication-promote
  cancel-in-progress: false

jobs:
  promote:
    name: Merge validated scheduled publication
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      startsWith(github.event.workflow_run.head_branch, 'publish/gmd-')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - name: Resolve and merge publication PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
          EXPECTED_HEAD: ${{ github.event.workflow_run.head_sha }}
          EXPECTED_BRANCH: ${{ github.event.workflow_run.head_branch }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${PR_NUMBER:-}" || { echo 'Quality run has no PR number'; exit 1; }
          meta="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json state,headRefName,headRefOid,baseRefName,title,isDraft,headRepositoryOwner)"
          echo "$meta"
          state="$(jq -r .state <<<"$meta")"
          head="$(jq -r .headRefName <<<"$meta")"
          oid="$(jq -r .headRefOid <<<"$meta")"
          base="$(jq -r .baseRefName <<<"$meta")"
          title="$(jq -r .title <<<"$meta")"
          if [ "$state" = "MERGED" ] && [ "$oid" = "$EXPECTED_HEAD" ]; then
            echo "Already promoted this exact publication; continuing verification handoff."
            exit 0
          fi
          test "$state" = "OPEN"
          test "$head" = "$EXPECTED_BRANCH"
          test "$oid" = "$EXPECTED_HEAD"
          test "$base" = "main"
          [[ "$title" == GMD\ Publish* ]]
          test "$(jq -r .isDraft <<<"$meta")" = "false"
          test "$(jq -r .headRepositoryOwner.login <<<"$meta")" = "${REPO%%/*}"
          # Re-read current main after Quality finishes. Old/duplicate jobs must
          # not roll back the latest pointer or downgrade an official edition.
          checked_main="$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)"
          gh api "repos/$REPO/contents/docs/data/latest.json?ref=$checked_main" --jq .content | base64 --decode > /tmp/current-latest.json
          gh api "repos/$REPO/contents/docs/data/latest.json?ref=$EXPECTED_HEAD" --jq .content | base64 --decode > /tmp/candidate-latest.json
          python scripts/validate_publication_transition.py /tmp/current-latest.json /tmp/candidate-latest.json
          test "$(gh api "repos/$REPO/git/ref/heads/main" --jq .object.sha)" = "$checked_main" || { echo "Main changed during preflight; rerun Quality against current main."; exit 1; }
          gh pr merge "$PR_NUMBER" --repo "$REPO" --squash --delete-branch --match-head-commit "$EXPECTED_HEAD" \
            --subject "${title}" \
            --body "Automatically promoted after Publication Quality Gate passed."
          merge_sha="$(gh pr view "$PR_NUMBER" --repo "$REPO" --json mergeCommit --jq '.mergeCommit.oid // empty')"
          test -n "$merge_sha" || { echo 'Merged PR has no merge commit SHA'; exit 1; }
          echo "PROMOTED PR #$PR_NUMBER ($EXPECTED_BRANCH) -> $merge_sha"

      - name: Dispatch immediate Pages deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # Publication availability is independent from 30D derivation. Deploy
          # the validated report immediately using the last-known-good 30D data.
          gh workflow run pages.yml --repo "$REPO" --ref main
          echo "DISPATCHED Deploy Global Market Daily on main"

      - name: Dispatch post-merge 30D refresh independently
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          # 30D is a derived product. Its failure must be visible but must never
          # block the newly validated daily report from reaching Pages.
          gh workflow run trends-refresh.yml --repo "$REPO" --ref main
          echo "DISPATCHED Refresh 30D Market Lens on main"

