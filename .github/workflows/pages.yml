name: Deploy Global Market Daily

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "prompts/**"
      - "scripts/**"
      - "schemas/**"
      - ".github/workflows/pages.yml"
  # Keep this dispatch entry: trends-refresh.yml uses it as the reliable
  # handoff after derived data settles because GITHUB_TOKEN pushes do not
  # recursively start push-triggered workflows.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate publication bundle, automation and editorial UI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Run deterministic publication gate
        run: python scripts/validate_publish_v2.py --root .
      - name: Enforce live renderer contract
        run: python scripts/validate_live_contract.py --root .
      - name: Enforce formal archive renderer contracts
        run: python scripts/validate_archive_live_contract.py --root .
      - name: Enforce standalone morning and close automation prompts
        run: python scripts/validate_automation_contract.py .
      - name: Enforce editorial signal and watch-first UI contract
        run: python scripts/validate_editorial_ui.py .
      - name: Run frontend visibility gate
        run: python scripts/validate_frontend.py --root .
      - name: Run 30D market lens gate
        run: python scripts/validate_market_lens.py
      - name: Check JavaScript syntax
        run: |
          node --check docs/assets/app.js
          node --check docs/assets/publication-compat.js
          node --check docs/assets/editorial-v2.js
          node --check docs/assets/p0.js
          node --check docs/assets/trends.js

  deploy:
    name: Deploy GitHub Pages
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
