name: Deploy Global Market Daily

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/validate_publish.py"
      - "scripts/validate_frontend.py"
      - "scripts/validate_market_lens.py"
      - "scripts/validate_v21_contract.py"
      - "schemas/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    name: Validate publication bundle, trend lens and reader experience
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check --quiet "jsonschema>=4.23,<5"

      - name: Run release gates
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_publish.py --root .
          python scripts/validate_frontend.py --root .
          python scripts/validate_market_lens.py
          python scripts/validate_v21_contract.py
          node --check docs/assets/app.js
          node --check docs/assets/p0.js
          node --check docs/assets/trends.js

  deploy:
    name: Deploy GitHub Pages
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload static site
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
